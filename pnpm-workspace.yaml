packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

catalog:
  '@eslint/js': 10.0.1
  '@fastify/static': 10.1.10
  '@fastify/websocket': 11.3.3
  '@fontsource/inter': 5.3.0
  '@types/node': 26.6.4
  '@types/ws': 8.18.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@typescript/native': npm:typescript@7.0.2
  '@vitejs/plugin-react': 6.1.2
  cs2parser: 2.7.2
  eslint: 10.12.0
  eslint-plugin-react-hooks: 7.1.1
  fastify: 5.12.8
  prettier: 3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  tsx: 4.23.15
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-eslint: 8.71.0
  vite: 8.3.6
  vitest: 5.0.3
  zod: 4.6.7
frozenLockfile: true
minimumReleaseAgeExclude:
  - '@fastify/websocket@11.3.3'
  - cs2-c4-damage@0.1.1
verifyDepsBeforeRun: error

disallowWorkspaceCycles: true
tasks:
  build:
    dependsOn: ['^build']
  typecheck:
    dependsOn: ['^build']
  consumer:typecheck:
    dependsOn: ['build']

# Miniflare 4 pins vulnerable transitive versions; remove when stable upstream
# includes the fixes (undici GHSA-2m5v-pch6-74hx; sharp GHSA-wq5f-xc86-pv6w).
overrides:
  miniflare@4.20260730.0>undici: 7.30.1
  miniflare@4.20260730.0>sharp: 0.35.5
