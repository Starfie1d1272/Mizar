[workspace]
members = ["common", "launcher", "applier"]
resolver = "2"

[workspace.package]
version = "1.13.3"
edition = "2021"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[profile.ci]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
incremental = true
strip = true
