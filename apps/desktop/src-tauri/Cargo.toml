[package]
name = "mizar-desktop"
version = "1.0.0-rc.22"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-runtime = "=2.12.1"
tauri-runtime-wry = "=2.12.1"
tauri-utils = "=2.10.1"
tauri-macros = "=2.7.1"
serde_json = "1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "=2.8.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[build-dependencies]
tauri-build = "=2.7.1"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.ci]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 256
incremental = true
strip = true
