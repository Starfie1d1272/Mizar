[package]
name = "rivalhub-broadcast-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
serde_json = "1.0"
tauri-plugin-dialog = "=2.7.3"

[build-dependencies]
tauri-build = "=2.6.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
