[package]
name = "mizar-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-runtime = "=2.12.1"
tauri-runtime-wry = "=2.12.1"
tauri-utils = "=2.10.1"
tauri-macros = "=2.7.1"
serde_json = "1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "=2.8.1"

[build-dependencies]
tauri-build = "=2.7.1"

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.ci]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = true
