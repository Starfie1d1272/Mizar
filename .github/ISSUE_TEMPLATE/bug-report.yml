name: 缺陷报告
description: 报告当前已实现行为中可复现的缺陷。
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 正确情况下应发生什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现方式
      description: 给出最小复现步骤、测试样例、重放、日志、截图或运行上下文。
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 发生环境
      description: 缺陷在哪个环境中观察到？
      options:
        - macOS 开发环境
        - GitHub Actions macOS
        - GitHub Actions Windows
        - 真实 Windows
        - Windows + CS2
        - Windows + OBS
        - Windows + CS2 + OBS
        - 其它 / 未知
    validations:
      required: true

  - type: textarea
    id: environment_details
    attributes:
      label: 环境详情
      description: OS、CS2、OBS、Browser Source、commit SHA、运行时版本等相关信息。

  - type: textarea
    id: impact
    attributes:
      label: 影响
      description: 说明对用户、生产正确性、延迟或可靠性的影响。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 从「高级设置 → 运行诊断 / 导出诊断包」保存并附上诊断包，注明版本与发生时间。可附截图或最小复现；不要公开整个 state 目录、原始日志或密钥。

  - type: textarea
    id: invariants
    attributes:
      label: 相关不变量 / 疑似边界
      description: 如已知，请引用相关 ADR、package 或数据通道；证据不足时不要猜测。

  - type: textarea
    id: validation
    attributes:
      label: 修复验收
      description: 什么回归测试、重放或真实环境证据可以证明问题已修复？
    validations:
      required: true
