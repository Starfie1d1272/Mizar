name: 实现任务
description: 目标与主要方案明确，可直接开展的实现任务。
title: "[任务] "
body:
  - type: markdown
    attributes:
      value: |
        仅在主要产品与架构决策已经冻结时使用此模板。如果仍存在关键方案选择，请先使用“设计 / 架构任务”。

  - type: textarea
    id: objective
    attributes:
      label: 目标
      description: 描述完成后可观察的产品能力或修复结果。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景与约束
      description: 说明任务原因，以及相关产品、架构、协议、讨论或外部约束。
    validations:
      required: true

  - type: textarea
    id: decisions
    attributes:
      label: 已冻结决策
      description: 列出已确定的设计与约束，调整时在对应讨论中说明理由。
      placeholder: |
        - 当前架构文档中的职责划分
        - 核心模块的依赖方向
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 本任务必须完成的准确工作。
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: 范围边界
      description: 说明与相邻任务的分工。
    validations:
      required: true

  - type: textarea
    id: architecture
    attributes:
      label: 架构与所有权
      description: 涉及哪些包、应用、依赖方向与数据职责。
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 实施方案
      description: 基于当前仓库给出实施步骤，局部选择遵循既定架构。
    validations:
      required: true

  - type: dropdown
    id: implementation_environment
    attributes:
      label: 实现环境
      description: 此任务可以在哪里实现？这与最终真实环境验收分开。
      options:
        - 跨平台 / macOS 为主
        - Windows 专用
        - 其它明确环境
    validations:
      required: true

  - type: checkboxes
    id: automated_validation
    attributes:
      label: 自动化验证
      description: 本任务需要哪些自动化环境或检查？
      options:
        - label: 本地确定性测试
        - label: macOS CI
        - label: Windows CI
        - label: Linux CI

  - type: dropdown
    id: real_environment_gate
    attributes:
      label: 真实环境验收门槛
      description: 在任务可视为完全验收前，需要什么生产近似环境证据？
      options:
        - 不需要
        - 真实 Windows
        - Windows + CS2
        - Windows + OBS
        - Windows + CS2 + OBS
    validations:
      required: true

  - type: textarea
    id: platform_notes
    attributes:
      label: 平台与验收说明
      description: 说明预期验证环境、测试样例或验收证据；如不需要真实环境，也说明原因。

  - type: textarea
    id: tests
    attributes:
      label: 必要测试
      description: 列出单元、集成、重放、视觉、长时间运行或真实环境测试。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 给出可复现的关闭条件，包括必要的平台门槛。
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 验证命令与证据
      description: PR 交接时应提供的命令和证据。
      placeholder: |
        pnpm typecheck
        pnpm lint
        pnpm test
        pnpm build
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖关系
      description: 说明被什么阻塞、会阻塞什么，以及跨仓依赖。

  - type: textarea
    id: docs
    attributes:
      label: 文档影响
      description: 需要同步哪些当前文档、讨论记录或 README；若没有也请明确说明。
    validations:
      required: true

  - type: textarea
    id: handoff
    attributes:
      label: 交接要求
      description: 除 CONTRIBUTING.md 外，最终 PR 还必须报告哪些任务特有信息。
      placeholder: "例如：偏离项、实际验证证据、后续实机验收、剩余风险和后续工作。"
    validations:
      required: true
