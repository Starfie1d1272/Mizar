name: 设计 / 架构任务
description: 在进入实现前调研并冻结重要产品或技术决策。
title: "[设计] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 需要解决什么产品或工程不确定性？
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景与约束
      description: 当前产品、架构、运行和仓库约束是什么？
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 必要证据 / 调研
      description: 必须检查哪些代码、文档、参考项目、真实运行证据或外部规范？
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: 需要冻结的决策
      description: 枚举本任务必须回答的具体问题。
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: 既定约束
      description: 引用相关当前规范、讨论记录与职责边界。
    validations:
      required: true

  - type: textarea
    id: platform
    attributes:
      label: 平台与验收影响
      description: 是否影响 macOS 开发、Windows CI、真实 Windows、CS2、OBS、打包或生产验收？说明验证方式。
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: 交付物
      description: 设计完成后应更新什么，例如当前规范、方案讨论或可直接执行的实现任务。
    validations:
      required: true

  - type: textarea
    id: exit
    attributes:
      label: 完成标准
      description: 说明后续实现开始前需要明确的结论与验收条件。
    validations:
      required: true
