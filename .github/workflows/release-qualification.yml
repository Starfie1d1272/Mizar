name: Release Qualification
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string
      label:
        required: true
        default: RC1
        type: string
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download original RC0
        shell: pwsh
        run: |
          gh release download v1.0.0-rc.0 --repo Starfie1d1272/Mizar --pattern '*portable*.zip' --dir download
      - name: Extract using Windows Expand-Archive
        shell: pwsh
        run: |
          $zip = (Get-ChildItem download -Filter '*.zip').FullName
          $destination = Join-Path $env:RUNNER_TEMP 'RC0 Windows extraction'
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          $bundle = (Get-ChildItem $destination -Directory | Select-Object -First 1).FullName
          Get-Item (Join-Path $bundle 'resources/app/dist/app.d.ts')
          & (Join-Path $bundle 'resources/runtime/node.exe') --input-type=module -e "import {verifyPayload} from './scripts/qualification/product-runtime.mjs'; console.log(await verifyPayload(process.argv[1]));" $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Expand-Archive payload validation failed' }
      - name: Extract using Windows Shell ZIP handler
        shell: pwsh
        run: |
          $zip = (Get-ChildItem download -Filter '*.zip').FullName
          $destination = Join-Path $env:RUNNER_TEMP 'RC0 Shell extraction'
          New-Item -ItemType Directory -Path $destination | Out-Null
          $shell = New-Object -ComObject Shell.Application
          $source = $shell.NameSpace($zip)
          if ($null -eq $source) { throw 'Shell ZIP handler cannot open RC0 archive' }
          $target = $shell.NameSpace($destination)
          $target.CopyHere($source.Items(), 1556)
          $deadline = (Get-Date).AddMinutes(3)
          $bundle = Join-Path $destination 'Mizar-RC0-win-x64-portable-26605da'
          $sums = Join-Path $bundle 'resources/metadata/SHA256SUMS'
          do {
            Start-Sleep -Seconds 3
            $count = @(Get-ChildItem $bundle -File -Recurse -ErrorAction SilentlyContinue).Count
            Write-Host "Shell extracted files: $count"
          } while ($count -lt 6215 -and (Get-Date) -lt $deadline)
          Get-Item (Join-Path $bundle 'resources/app/dist/app.d.ts')
          & (Join-Path $bundle 'resources/runtime/node.exe') --input-type=module -e "import {verifyPayload} from './scripts/qualification/product-runtime.mjs'; console.log(await verifyPayload(process.argv[1]));" $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Shell payload validation failed' }
