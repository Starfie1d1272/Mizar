name: Release Qualification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact SHA of this main workflow run; checkout and signer source must match'
        required: true
        type: string
      label:
        description: 'Qualification report label (e.g. RC0); product names use the app version'
        required: true
        default: RC1
        type: string
      resource_pack_version:
        description: 'Immutable official resource version; advance when source/archive identity changes'
        required: true
        type: string
      resource_sequence:
        description: 'Positive monotonically increasing official resource sequence'
        required: true
        type: number
      resource_source_run:
        description: 'Optional successful main Promotion run for original published resources; qualified reuse must retain original publication proofs'
        required: false
        type: string
      resource_source_artifact:
        description: 'Optional exact original publication artifact name; a unique Promotion resource artifact is selected automatically'
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  RELEASE_LABEL: ${{ inputs.label }}
  QUALIFICATION_SOURCE_INPUT: ${{ inputs.ref }}
  RESOURCE_BUILD_ROOT: ${{ github.workspace }}/.agent-tmp/release-resources
  RESOURCE_PACK_VERSION: ${{ inputs.resource_pack_version }}
  RESOURCE_SEQUENCE: ${{ inputs.resource_sequence }}
  RESOURCE_SOURCE_RUN: ${{ inputs.resource_source_run }}
  RESOURCE_SOURCE_ARTIFACT: ${{ inputs.resource_source_artifact }}
  QUALIFICATION_BUILD_ROOT: ${{ github.workspace }}/.agent-tmp/rivalhub-qualification-build

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      archive_sha256: ${{ steps.candidate.outputs.archive_sha256 }}
      resource_artifact: ${{ steps.resources.outputs.artifact }}
    steps:
      # Reject an untrusted workflow branch before running checked-out policy code.
      - name: Require main qualification workflow
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Qualification must run from main' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Pin checked-out source
        id: source
        run: node scripts/qualification/release-identity.mjs qualification
      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Restore Cargo dependency and profile caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          profile: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore committed lockfile after Windows install
        shell: pwsh
        run: git checkout -- pnpm-lock.yaml

      - name: Build exact-SHA Windows qualification bundle
        run: node scripts/qualification/build.mjs --output "$env:QUALIFICATION_BUILD_ROOT" --label "$env:RELEASE_LABEL"

      - name: Partition the same-run verified Full candidate into a distinct Core
        run: node scripts/qualification/core-candidate.mjs "$env:QUALIFICATION_BUILD_ROOT"

      - name: Test Windows desktop startup deadlines and diagnostics
        run: cargo test --profile release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify release desktop profile metadata
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath $env:QUALIFICATION_BUILD_ROOT -Directory | Select-Object -First 1
          if ($null -eq $bundle) { throw '未生成 release qualification bundle 目录' }
          $artifactPath = Join-Path $bundle.FullName 'resources/metadata/artifact.json'
          $artifact = Get-Content -Raw -LiteralPath $artifactPath | ConvertFrom-Json
          if ($artifact.desktopBuildProfile -ne 'release') { throw "Release Qualification 使用了错误 profile：$($artifact.desktopBuildProfile)" }

      - name: Record candidate ZIP identity
        id: candidate
        shell: pwsh
        run: |
          $manifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          "archive_sha256=$($manifest.archiveSha256)" >> $env:GITHUB_OUTPUT

      - name: Build independent resource candidate from the same source (no Core rebuild)
        id: resources
        shell: pwsh
        run: |
          if ($env:RESOURCE_SOURCE_RUN) {
            if ($env:RESOURCE_SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid original run' }
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RESOURCE_SOURCE_RUN" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_branch -ne 'main' -or $run.path -notin @('.github/workflows/release-qualification.yml','.github/workflows/release-promotion.yml')) { throw 'Resource reuse requires a successful original main workflow' }
            $artifactName = $env:RESOURCE_SOURCE_ARTIFACT
            if (!$artifactName) {
              if ($run.path -eq '.github/workflows/release-promotion.yml') {
                $available = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RESOURCE_SOURCE_RUN/artifacts?per_page=100" | ConvertFrom-Json
                if ($LASTEXITCODE -ne 0) { throw 'Original resource artifact lookup failed' }
                $resourceArtifacts = @($available.artifacts | Where-Object { !$_.expired -and $_.name.StartsWith('promotion-resources-') })
                if ($available.total_count -gt 100 -or $resourceArtifacts.Count -ne 1) { throw 'Specify the exact original publication artifact; automatic selection is ambiguous' }
                $artifactName = $resourceArtifacts[0].name
              } else { $artifactName = 'release-qualified-resources' }
            }
            $original = Join-Path $env:RUNNER_TEMP 'original-resource-artifact'
            gh run download $env:RESOURCE_SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name "$artifactName" --dir "$original"
            if ($LASTEXITCODE -ne 0) { throw 'Original resource artifact unavailable' }
            node scripts/ci/resource-release.mjs reuse "$env:RESOURCE_BUILD_ROOT" (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-release-manifest.json') "$original" "$env:RESOURCE_SEQUENCE"
          } else {
            node scripts/ci/resource-release.mjs prepare "$env:RESOURCE_BUILD_ROOT" (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-release-manifest.json') "$env:RESOURCE_PACK_VERSION" "$env:RESOURCE_SEQUENCE"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Resource producer/source/catalog validation failed' }
          "artifact=release-resource-candidate-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT
      - name: Preserve original resource candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.resources.outputs.artifact }}
          path: ${{ env.RESOURCE_BUILD_ROOT }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload unqualified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            ${{ env.QUALIFICATION_BUILD_ROOT }}/*.zip
            ${{ env.QUALIFICATION_BUILD_ROOT }}/*.zip.sha256
            ${{ env.QUALIFICATION_BUILD_ROOT }}/release-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/core-release-manifest.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload build measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-evidence
          path: ${{ env.QUALIFICATION_BUILD_ROOT }}/build-timings.json
          if-no-files-found: warn

      - name: Save reusable main Cargo caches
        if: ${{ github.ref == 'refs/heads/main' && steps.source.outputs.sha == github.sha }}
        uses: ./.github/actions/save-cargo-cache
        with:
          profile: release
          registry-key: ${{ steps.cargo-cache.outputs.registry-key }}
          registry-hit: ${{ steps.cargo-cache.outputs.registry-hit }}
          target-key: ${{ steps.cargo-cache.outputs.target-key }}
          target-hit: ${{ steps.cargo-cache.outputs.target-hit }}

  verify:
    name: verify / ${{ matrix.lane }}
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [portable, setup]
    env:
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: ${{ env.QUALIFICATION_BUILD_ROOT }}
      - name: Verify candidate transfer before extraction
        run: node scripts/qualification/verify-candidate.mjs "$env:QUALIFICATION_BUILD_ROOT" "$env:SOURCE_SHA" "$env:ARCHIVE_SHA256"
      - name: Extract portable bundle and smoke test
        if: ${{ matrix.lane == 'portable' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $manifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          $archive = Get-Item -LiteralPath (Join-Path $env:QUALIFICATION_BUILD_ROOT $manifest.archive)
          if ($null -eq $archive) { throw '未生成 qualification ZIP' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'qualification extracted path'
          if (Test-Path -LiteralPath $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }
          & ./scripts/qualification/extract-windows-shell.ps1 -Archive $archive.FullName -Destination $extractRoot
          $bundleRoot = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          if ($null -eq $bundleRoot) { throw '未能解压 qualification bundle 根目录' }
          Push-Location $bundleRoot.FullName
          try {
            foreach ($name in @('LICENSE', 'THIRD-PARTY-NOTICES.md')) {
              if (!(Test-Path -LiteralPath (Join-Path $bundleRoot.FullName $name))) { throw "缺少许可文件：$name" }
            }
            & .\resources\runtime\node.exe ($env:GITHUB_WORKSPACE + '\scripts\qualification\verify-c4-resources.mjs') (Join-Path $bundleRoot.FullName 'resources/app') | Tee-Object -FilePath (Join-Path $env:QUALIFICATION_BUILD_ROOT 'c4-resources.log')
            if ($LASTEXITCODE -ne 0) { throw 'installed C4 资源校验失败' }
            & .\resources\runtime\node.exe ($env:GITHUB_WORKSPACE + '\scripts\qualification\product-smoke.mjs') $bundleRoot.FullName | Tee-Object -FilePath (Join-Path $env:QUALIFICATION_BUILD_ROOT 'portable-smoke.log')
            if ($LASTEXITCODE -ne 0) { throw '便携 EXE smoke 失败' }
            & .\resources\runtime\node.exe ($env:GITHUB_WORKSPACE + '\scripts\qualification\desktop-smoke.mjs') $bundleRoot.FullName (Join-Path $env:QUALIFICATION_BUILD_ROOT 'desktop-smoke.json')
            if ($LASTEXITCODE -ne 0) { throw '正常桌面 GUI cold-start smoke 失败' }
          } finally {
            Pop-Location
          }

      - name: Measure installed C4 worker responsiveness
        if: ${{ matrix.lane == 'portable' }}
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'qualification extracted path') -Directory | Select-Object -First 1
          & (Join-Path $bundle.FullName 'resources/runtime/node.exe') scripts/qualification/c4-worker-benchmark.mjs (Join-Path $bundle.FullName 'resources/app') (Join-Path $env:QUALIFICATION_BUILD_ROOT 'c4-worker-benchmark.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed C4 worker probe failed' }

      - name: Run 3-map exact-artifact synthetic lifecycle soak
        if: ${{ matrix.lane == 'portable' }}
        shell: pwsh
        run: |
          $extractedRoot = Join-Path $env:RUNNER_TEMP 'qualification extracted path'
          $bundleRoot = Get-ChildItem -LiteralPath $extractedRoot -Directory | Select-Object -First 1
          if ($null -eq $bundleRoot) { throw '未找到解压后的便携产品包' }
          $reportPath = Join-Path $env:QUALIFICATION_BUILD_ROOT 'host-soak.json'
          node scripts/qualification/product-soak.mjs $bundleRoot.FullName $reportPath
          if ($LASTEXITCODE -ne 0) { throw 'exact-artifact 三地图合成生命周期 soak 失败' }

      - name: Extract pristine candidate for Setup
        if: ${{ matrix.lane == 'setup' }}
        shell: pwsh
        run: |
          $manifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          $extractRoot = Join-Path $env:RUNNER_TEMP 'qualification extracted path'
          & ./scripts/qualification/extract-windows-shell.ps1 -Archive (Join-Path $env:QUALIFICATION_BUILD_ROOT $manifest.archive) -Destination $extractRoot
      - name: Install pinned NSIS
        if: ${{ matrix.lane == 'setup' }}
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress

      - name: Verify native update cancellation and recovery
        if: ${{ matrix.lane == 'setup' }}
        shell: pwsh
        timeout-minutes: 5
        run: node scripts/qualification/verify-update-recovery.mjs

      - name: Build and verify same-content NSIS installer
        if: ${{ matrix.lane == 'setup' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $bundle = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'qualification extracted path') -Directory | Select-Object -First 1
          $extractRoot = Join-Path $env:RUNNER_TEMP 'setup extracted path'
          & ./scripts/qualification/create-windows-setup.ps1 -BundleRoot $bundle.FullName -OutputRoot $env:QUALIFICATION_BUILD_ROOT -ExtractRoot $extractRoot -CaptureUi
          $extracted = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          node scripts/qualification/product-smoke.mjs $extracted.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Setup portable smoke failed' }
          node scripts/qualification/desktop-smoke.mjs $extracted.FullName (Join-Path $env:QUALIFICATION_BUILD_ROOT 'setup-desktop-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Setup desktop GUI smoke failed' }

      - name: Qualify distinct Core payload and real NSIS installation
        if: ${{ matrix.lane == 'setup' }}
        shell: pwsh
        run: |
          $core = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-release-manifest.json') -Raw | ConvertFrom-Json
          $coreExtract = Join-Path $env:RUNNER_TEMP 'core candidate extracted'
          ./scripts/qualification/extract-windows-shell.ps1 -Archive (Join-Path $env:QUALIFICATION_BUILD_ROOT $core.archive) -Destination $coreExtract
          $payload = @(Get-ChildItem -LiteralPath $coreExtract -Directory)
          if ($payload.Count -ne 1) { throw 'Core extraction is ambiguous' }
          $installed = Join-Path $env:RUNNER_TEMP 'core installed qualification'
          ./scripts/qualification/create-windows-setup.ps1 -BundleRoot $payload[0].FullName -OutputRoot $env:QUALIFICATION_BUILD_ROOT -ExtractRoot $installed -ManifestName core-release-manifest.json -DistributionName core-distribution-manifest.json
          $root = @(Get-ChildItem -LiteralPath $installed -Directory)
          if ($root.Count -ne 1) { throw 'Core installation is ambiguous' }
          node scripts/qualification/verify-core-candidate.mjs $env:QUALIFICATION_BUILD_ROOT $root[0].FullName $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Core identity or resource boundary failed' }
          node scripts/qualification/product-smoke.mjs $root[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Real installed Core startup failed' }
          node scripts/qualification/desktop-smoke.mjs $root[0].FullName (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-desktop-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Real Core desktop startup failed' }

      - name: Record successful lane identity
        shell: pwsh
        env:
          LANE: ${{ matrix.lane }}
        run: |
          $extractRoot = if ($env:LANE -eq 'setup') { Join-Path $env:RUNNER_TEMP 'setup extracted path' } else { Join-Path $env:RUNNER_TEMP 'qualification extracted path' }
          $manifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          node scripts/qualification/verify-promotion.mjs $env:QUALIFICATION_BUILD_ROOT $extractRoot "v$($manifest.appVersion)" $env:SOURCE_SHA (Join-Path $env:QUALIFICATION_BUILD_ROOT "$env:LANE-identity.json")
          if ($LASTEXITCODE -ne 0) { throw 'Lane identity verification failed' }

      - name: Upload verified distribution
        if: ${{ matrix.lane == 'setup' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-setup
          path: |
            ${{ env.QUALIFICATION_BUILD_ROOT }}/Mizar-*.exe
            ${{ env.QUALIFICATION_BUILD_ROOT }}/Mizar-*.exe.sha256
            ${{ env.QUALIFICATION_BUILD_ROOT }}/NSIS-LICENSE.txt
            ${{ env.QUALIFICATION_BUILD_ROOT }}/distribution-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/core-distribution-manifest.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Collect qualification evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'release-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          foreach ($name in @('host-soak.json', 'desktop-smoke.json', 'release-manifest.json', 'c4-resources.log', 'portable-smoke.log', 'distribution-manifest.json', 'setup-desktop-smoke.json', 'core-desktop-smoke.json', 'core-release-manifest.json', 'core-distribution-manifest.json', 'c4-worker-benchmark.json', 'portable-identity.json', 'setup-identity.json')) {
            $path = Join-Path $env:QUALIFICATION_BUILD_ROOT $name
            if (Test-Path -LiteralPath $path) { Copy-Item -LiteralPath $path -Destination $evidenceRoot }
          }
          $extractedRoot = if ('${{ matrix.lane }}' -eq 'setup') { Join-Path $env:RUNNER_TEMP 'setup extracted path' } else { Join-Path $env:RUNNER_TEMP 'qualification extracted path' }
          if (Test-Path -LiteralPath $extractedRoot) {
            $bundle = Get-ChildItem -LiteralPath $extractedRoot -Directory | Select-Object -First 1
            if ($null -ne $bundle) {
              Copy-Item -LiteralPath (Join-Path $bundle.FullName 'resources/metadata') -Destination $evidenceRoot -Recurse
              $statePath = Join-Path $bundle.FullName 'state'
              if (Test-Path -LiteralPath $statePath) {
                # Preserve diagnostics at relative paths without bundling runtime state or secrets.
                Get-ChildItem -LiteralPath $statePath -Recurse -File | Where-Object { $_.FullName -match '[\\/]logs[\\/]' } | ForEach-Object {
                  $target = Join-Path $evidenceRoot ([IO.Path]::GetRelativePath($bundle.FullName, $_.FullName))
                  New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
                  Copy-Item -LiteralPath $_.FullName -Destination $target
                }
              }
            }
          }
          if ('${{ matrix.lane }}' -eq 'setup') {
            $installerUi = Join-Path (Split-Path $env:QUALIFICATION_BUILD_ROOT -Parent) 'installer-ui'
            if (Test-Path -LiteralPath $installerUi) { Copy-Item -LiteralPath $installerUi -Destination (Join-Path $evidenceRoot 'installer-ui') -Recurse }
          }
          $evidenceName = 'Mizar-' + $env:RELEASE_LABEL + '-${{ matrix.lane }}-evidence.zip'
          Compress-Archive -Path (Join-Path $evidenceRoot '*') -DestinationPath (Join-Path $env:RUNNER_TEMP $evidenceName)

      - name: Upload release qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.lane }}
          path: ${{ runner.temp }}/Mizar-*-evidence.zip
          if-no-files-found: error

  release_qualification:
    name: release_qualification
    needs: [build, verify]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - name: Set up Node.js 24 for fixed resource verification
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: ${{ env.QUALIFICATION_BUILD_ROOT }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-setup
          path: ${{ env.QUALIFICATION_BUILD_ROOT }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/lane-evidence
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-build-evidence
          path: ${{ runner.temp }}/release-evidence
      - name: Download exact resource candidate built by this source job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.build.outputs.resource_artifact }}
          path: ${{ env.RESOURCE_BUILD_ROOT }}
      - name: Verify resource content/catalog against the assembled Core candidate
        shell: pwsh
        run: |
          node scripts/ci/resource-release.mjs check "$env:RESOURCE_BUILD_ROOT" (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-release-manifest.json')
          if ($LASTEXITCODE -ne 0) { throw 'Resource transfer/compatibility/source mismatch' }
      - name: Verify all lane identities and assembled assets
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'release-evidence'
          foreach ($lane in @('portable', 'setup')) {
            $archive = Join-Path $env:RUNNER_TEMP "lane-evidence/Mizar-$env:RELEASE_LABEL-$lane-evidence.zip"
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $evidenceRoot $lane)
          }
          node scripts/qualification/release-identity.mjs qualification (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate and attestation source mismatch' }
          node scripts/qualification/verify-candidate.mjs $env:QUALIFICATION_BUILD_ROOT $env:SOURCE_SHA $env:ARCHIVE_SHA256 $evidenceRoot
          if ($LASTEXITCODE -ne 0) { throw 'Candidate/lane identity mismatch' }
          $manifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          $extractRoot = Join-Path $env:RUNNER_TEMP 'final candidate'
          Expand-Archive -LiteralPath (Join-Path $env:QUALIFICATION_BUILD_ROOT $manifest.archive) -DestinationPath $extractRoot
          node scripts/qualification/verify-promotion.mjs $env:QUALIFICATION_BUILD_ROOT $extractRoot "v$($manifest.appVersion)" $env:SOURCE_SHA (Join-Path $evidenceRoot 'qualified-identity.json')
          if ($LASTEXITCODE -ne 0) { throw 'Assembled product identity mismatch' }
          node scripts/qualification/update-manifest.mjs $env:QUALIFICATION_BUILD_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Stable update manifest generation failed' }
          if ($manifest.appVersion -match '^\d+\.\d+\.\d+$') {
            $coreManifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-release-manifest.json') -Raw | ConvertFrom-Json
            $coreExtract = Join-Path $env:RUNNER_TEMP 'final Core candidate'
            Expand-Archive -LiteralPath (Join-Path $env:QUALIFICATION_BUILD_ROOT $coreManifest.archive) -DestinationPath $coreExtract
            $cores = @(Get-ChildItem -LiteralPath $coreExtract -Directory)
            if ($cores.Count -ne 1) { throw 'Qualified Core extraction is ambiguous' }
            node scripts/qualification/verify-core-candidate.mjs $env:QUALIFICATION_BUILD_ROOT $cores[0].FullName $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Final Core qualification identity failed' }
            ./scripts/web-installer/build.ps1 -ProductDirectory $env:QUALIFICATION_BUILD_ROOT -CoreDirectory $cores[0].FullName -OutputDirectory $env:QUALIFICATION_BUILD_ROOT -Qualification
            if ($LASTEXITCODE) { throw 'Qualified native installer build failed' }
            "QUALIFIED_CORE_DIRECTORY=$($cores[0].FullName)" >> $env:GITHUB_ENV
          }
          Copy-Item (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') $evidenceRoot
          Compress-Archive -Path (Join-Path $evidenceRoot '*') -DestinationPath (Join-Path $env:RUNNER_TEMP "Mizar-$env:RELEASE_LABEL-evidence.zip")

      - name: Attest qualified portable ZIP provenance
        id: qualified-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.QUALIFICATION_BUILD_ROOT }}/*.zip
            ${{ env.QUALIFICATION_BUILD_ROOT }}/Mizar-*.exe
            ${{ env.QUALIFICATION_BUILD_ROOT }}/NSIS-LICENSE.txt
            ${{ env.QUALIFICATION_BUILD_ROOT }}/web-installer-build.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/distribution-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/core-distribution-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/release-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/core-release-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/update-manifest.json

      - name: Attest original resource archive and frozen catalog qualification
        if: ${{ inputs.resource_source_run == '' }}
        id: resource-qualified-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.RESOURCE_BUILD_ROOT }}/*.zip
            ${{ env.RESOURCE_BUILD_ROOT }}/resource-descriptor.json
      - name: Attest only current Core authorization for reused resources
        if: ${{ inputs.resource_source_run != '' }}
        id: reused-resource-descriptor-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.RESOURCE_BUILD_ROOT }}/resource-descriptor.json
      - name: Preserve and verify original resource Qualification proofs
        shell: pwsh
        env:
          RESOURCE_QUALIFICATION_BUNDLE: ${{ steps.resource-qualified-provenance.outputs.bundle-path || steps.reused-resource-descriptor-provenance.outputs.bundle-path }}
        run: |
          if (!$env:RESOURCE_SOURCE_RUN) { Copy-Item -LiteralPath $env:RESOURCE_QUALIFICATION_BUNDLE -Destination (Join-Path $env:RESOURCE_BUILD_ROOT 'resource-pack-provenance.json') }
          Copy-Item -LiteralPath $env:RESOURCE_QUALIFICATION_BUNDLE -Destination (Join-Path $env:RESOURCE_BUILD_ROOT 'resource-descriptor-qualification-provenance.json')
          node scripts/ci/resource-release.mjs qualified "$env:RESOURCE_BUILD_ROOT" (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-release-manifest.json')
          if ($LASTEXITCODE -ne 0) { throw 'Original resource Qualification proof validation failed' }
      - name: Upload original qualified resources (not publication authorization)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualified-resources
          path: ${{ env.RESOURCE_BUILD_ROOT }}/*
          compression-level: 0
          if-no-files-found: error

      - name: Preserve original update verification bundle
        shell: pwsh
        env:
          PROVENANCE_BUNDLE: ${{ steps.qualified-provenance.outputs.bundle-path }}
        run: |
          Copy-Item -LiteralPath $env:PROVENANCE_BUNDLE -Destination (Join-Path $env:QUALIFICATION_BUILD_ROOT 'qualification-provenance.json')
          if (Test-Path -LiteralPath (Join-Path $env:QUALIFICATION_BUILD_ROOT 'update-manifest.json')) {
            Copy-Item -LiteralPath $env:PROVENANCE_BUNDLE -Destination (Join-Path $env:QUALIFICATION_BUILD_ROOT 'update-provenance.json')
          }

      - name: Verify actual signed candidate through isolated client SDK
        shell: pwsh
        run: |
          node scripts/qualification/verify-qualified-install.mjs "$env:QUALIFICATION_BUILD_ROOT" "$env:RESOURCE_BUILD_ROOT" "$env:QUALIFIED_CORE_DIRECTORY"
          if ($LASTEXITCODE -ne 0) { throw 'Pre-publication client signature verification failed' }

      - name: Upload qualified portable product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-portable-product
          # ZIP and Setup are already compressed; preserve their original bytes.
          compression-level: 0
          path: |
            ${{ env.QUALIFICATION_BUILD_ROOT }}/*.zip
            ${{ env.QUALIFICATION_BUILD_ROOT }}/*.zip.sha256
            ${{ env.QUALIFICATION_BUILD_ROOT }}/Mizar-*.exe
            ${{ env.QUALIFICATION_BUILD_ROOT }}/Mizar-*.exe.sha256
            ${{ env.QUALIFICATION_BUILD_ROOT }}/NSIS-LICENSE.txt
            ${{ env.QUALIFICATION_BUILD_ROOT }}/web-installer-build.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/distribution-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/core-distribution-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/release-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/core-release-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/update-manifest.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/update-provenance.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/qualification-provenance.json
            ${{ env.QUALIFICATION_BUILD_ROOT }}/qualified-client-verification.json
          if-no-files-found: error

      - name: Upload release qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification-evidence
          path: ${{ runner.temp }}/Mizar-*-evidence.zip
          if-no-files-found: error
