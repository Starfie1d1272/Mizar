name: Publish qualified RC1 (one-off transfer)
'on':
  workflow_dispatch: null
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Starfie1d1272/Mizar
    steps:
    - name: Verify exact source checks
      run: |
        set -euo pipefail
        for run in 37300209826 37300123568; do
          gh run view "$run" --json headSha,conclusion > "run-$run.json"
        done
        python3 - <<'PY_CHECK'
        import json
        sha='7696815f6ec18f27b23f28c829c922e6820e126b'
        for run in [37300209826,37300123568]:
         d=json.load(open(f'run-{run}.json'))
         assert d['headSha']==sha and d['conclusion']=='success',d
        PY_CHECK
    - name: Download unchanged qualified RC1 artifacts
      run: |
        set -euo pipefail
        gh run download 37300123568 -n release-portable-product -D product
        gh run download 37300123568 -n release-qualification-evidence -D evidence
    - name: Write release notes template
      run: |
        cat > release-notes-template.md <<'NOTES'
        用于继续验证首次启动与 #35 Windows + CS2 + OBS 制播流程的 RC1，应用版本 `1.0.0-rc.1`。

        下载 **<ARCHIVE>**，完整解压到新的可写目录，等待解压完成后运行 `Mizar.exe`。无需安装 Node 或 pnpm；需要 Windows WebView2 Runtime。`evidence.zip` 供维护者核查，用户无需下载。

        本次修复：

        - RC0 在校验全部程序文件期间，桌面会在 35 秒后误报制播服务超时。RC1 为文件校验和服务就绪设置独立期限，校验进度进入日志。
        - 文件校验改为最多 8 个文件并发读取，保留全部文件 SHA256 和内容摘要验证。
        - 去掉运行时不需要的 npm、Corepack、类型声明、源码映射和构建缓存，减少首次启动的文件读取。
        - 缺失文件及校验超时显示具体阶段和诊断，避免全部归为服务启动失败。
        - Windows 自动化通过资源管理器 ZIP 处理器解压最终发布包，再校验资源、服务启动、GUI 与退出。

        构建身份：

        - 源码：`<SHA>`；修复：[PR #130](https://github.com/Starfie1d1272/Mizar/pull/130)。
        - 平台：Windows x64 Portable；desktop profile：`release`；Node：`<NODE>`。
        - ZIP SHA256：`<ZIP_SHA>`。
        - 内容摘要：`<CONTENT_SHA>`。
        - [源码 CI](https://github.com/Starfie1d1272/Mizar/actions/runs/37300209826)；[RC1 Release Qualification](https://github.com/Starfie1d1272/Mizar/actions/runs/37300123568)。

        已通过的自动化：全部文件与内容摘要、许可与 C4 地图资源、资源管理器解压后的正常 GUI 启动/退出、WebView2 缺失回滚、portable 启动复用/重启/端口冲突/GSI 恢复、三地图合成生命周期，以及 Windows 原生启动期限/日志测试。详见随附 evidence ZIP。

        尚待验证：原 Windows 机器上的首次启动，以及真实 CS2/GSI、OBS、整场制播和恢复。原始 RC0 ZIP 的 6214 条校验以及 Windows runner 的两种自带解压验证均通过；首轮实机缺失文件未在 runner 复现。RC1 必须在原机器复验，不把合成检查记为真实制播 PASS。
        NOTES
    - name: Verify ZIP, payload identity and Windows evidence
      run: |
        set -euo pipefail
        python3 - <<'PY_VERIFY'
        import json,hashlib,zipfile,pathlib
        m=json.load(open('product/release-manifest.json'))
        assert m['gitSha']=='7696815f6ec18f27b23f28c829c922e6820e126b'
        assert m['label']=='RC1' and m['desktopBuildProfile']=='release' and not m['developmentOnly']
        p=pathlib.Path('product')/m['archive']
        assert hashlib.sha256(p.read_bytes()).hexdigest()==m['archiveSha256']
        assert pathlib.Path(str(p)+'.sha256').read_text().split()[0]==m['archiveSha256']
        with zipfile.ZipFile(p) as z:
         root=m['archive'][:-4]+'/'
         a=json.loads(z.read(root+'resources/metadata/artifact.json'))
         assert a['gitSha']==m['gitSha'] and a['artifactSha256']==m['contentDigest']
         assert a['desktopBuildProfile']=='release' and not a['developmentOnly']
         digest=hashlib.sha256()
         sums=z.read(root+'resources/metadata/SHA256SUMS').decode().splitlines()
         entries=sorted((line.split('  ',1) for line in sums),key=lambda entry:entry[1])
         for sha,name in entries:
          assert hashlib.sha256(z.read(root+name)).hexdigest()==sha,name
          if name!='resources/metadata/artifact.json':digest.update(f'{name}\0{sha}\n'.encode())
         assert digest.hexdigest()==m['contentDigest']
         assert not any(i.filename.endswith(('.d.ts','.d.ts.map','.js.map','.tsbuildinfo')) for i in z.infolist())
         assert not any('/resources/runtime/node_modules/' in i.filename for i in z.infolist())
         assert root+'resources/runtime/LICENSE' in z.namelist()
         print('Verified ZIP checksum and',len(entries),'payload checksums')
        with zipfile.ZipFile('evidence/Mizar-RC1-evidence.zip') as z:
         assert json.loads(z.read('release-manifest.json'))==m
         d=json.loads(z.read('desktop-smoke.json'))
         assert d['result']=='PASS' and d['gitSha']==m['gitSha'] and d['artifactSha256']==m['contentDigest']
         s=json.loads(z.read('host-soak.json'))
         assert s['artifact']['gitSha']==m['gitSha'] and s['artifact']['artifactSha256']==m['contentDigest']
         template=pathlib.Path('release-notes-template.md').read_text()
         for key,value in {'<ARCHIVE>':m['archive'],'<SHA>':m['gitSha'],'<NODE>':m['nodeVersion'],'<ZIP_SHA>':m['archiveSha256'],'<CONTENT_SHA>':m['contentDigest']}.items():
          template=template.replace(key,value)
         pathlib.Path('release-notes.md').write_text(template)
        print(json.dumps(m))
        PY_VERIFY
    - name: Publish qualified RC1 unchanged
      run: |
        set -euo pipefail
        gh release create v1.0.0-rc.1 product/*.zip product/*.zip.sha256 product/release-manifest.json evidence/Mizar-RC1-evidence.zip --target 7696815f6ec18f27b23f28c829c922e6820e126b --title 'Mizar 1.0.0 RC1 — Windows x64 Portable' --notes-file release-notes.md --prerelease --draft --latest=false
        gh release edit v1.0.0-rc.1 --draft=false --prerelease --latest=false
        gh release view v1.0.0-rc.1 --json url,isDraft,isPrerelease,assets
