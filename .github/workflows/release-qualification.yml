name: Publish qualified RC0 (one-off transfer)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Starfie1d1272/Mizar
    steps:
      - name: Verify exact source checks and existing draft
        run: |
          set -euo pipefail
          for run in 37293574203 37293601817; do
            gh run view "$run" --json headSha,conclusion > "run-$run.json"
          done
          gh release view v1.0.0-rc.0 --json isDraft,isPrerelease,targetCommitish > draft.json
          python3 - <<'PY'
          import json
          sha='26605da1c200b31384ae6b6951fc0bf83ff4ce22'
          for run in [37293574203,37293601817]:
              d=json.load(open(f'run-{run}.json'));assert d['headSha']==sha and d['conclusion']=='success'
          d=json.load(open('draft.json'));assert d['isDraft'] and d['isPrerelease'] and d['targetCommitish']==sha
          PY
      - name: Download original qualified product and evidence
        run: |
          set -euo pipefail
          gh run download 37293601817 -n release-portable-product -D product
          gh run download 37293601817 -n release-qualification-evidence -D evidence
      - name: Verify identity and publish unchanged assets
        run: |
          set -euo pipefail
          cd product
          sha256sum -c Mizar-RC0-win-x64-portable-26605da.zip.sha256
          python3 - <<'PY'
          import json,hashlib,zipfile
          m=json.load(open('release-manifest.json'))
          assert m['gitSha']=='26605da1c200b31384ae6b6951fc0bf83ff4ce22'
          assert m['archive']=='Mizar-RC0-win-x64-portable-26605da.zip'
          assert m['archiveSha256']=='95836d8cf33ec2133cc676827f37c00ae0c87e4e405b2ed53454de8516fc51bc'
          assert m['desktopBuildProfile']=='release' and not m['developmentOnly']
          assert hashlib.sha256(open(m['archive'],'rb').read()).hexdigest()==m['archiveSha256']
          with zipfile.ZipFile('../evidence/Mizar-RC0-evidence.zip') as z:
              assert json.loads(z.read('release-manifest.json'))==m
              assert json.loads(z.read('desktop-smoke.json'))['result']=='PASS'
          PY
          gh release upload v1.0.0-rc.0 Mizar-RC0-win-x64-portable-26605da.zip Mizar-RC0-win-x64-portable-26605da.zip.sha256 release-manifest.json ../evidence/Mizar-RC0-evidence.zip
          gh release edit v1.0.0-rc.0 --draft=false --prerelease --latest=false
          gh release view v1.0.0-rc.0 --json url,isDraft,isPrerelease,assets
