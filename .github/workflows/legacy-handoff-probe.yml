name: Legacy handoff primitives experiment
on:
  push:
    branches: [experiment/legacy-handoff-primitives-20261111]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/qualification/probe-legacy-handoff.ps1
          sparse-checkout-cone-mode: false
      - name: Probe Windows 5.1 process and file handoff primitives
        shell: powershell
        run: ./scripts/qualification/probe-legacy-handoff.ps1
