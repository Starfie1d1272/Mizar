# Temporary artifact-boundary smoke. It uses synthetic local bytes and never writes Box.
name: PERF-ONLY Phase Receipt Smoke
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/box-phase-smoke.yml]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'fix/release-time-budget'
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create synthetic run-bound plan
        id: plan
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { createBoxPlan } from './scripts/qualification/box-phase-contract.mjs';
          const item = (name) => ({ name, size: 1, sha256: 'a'.repeat(64) });
          const plan = createBoxPlan({ runId: process.env.GITHUB_RUN_ID, attempt: Number(process.env.GITHUB_RUN_ATTEMPT), tag: 'v9.9.9', releaseId: 1, sourceSha: 'b'.repeat(40), coreArchiveSha: 'c'.repeat(64), assets: { runtime: [item('machine-metadata.json'), item('Mizar-v9.9.9-Windows-x64-Core-Setup.exe')], resources: [item('Mizar-official-epl-default-1.0.0.zip')], downloads: [item('Mizar-v9.9.9-Windows-x64-WebInstaller.exe')] }, updateIndex: item('update-index.json') });
          await writeFile(process.env.RUNNER_TEMP + '/plan.json', plan);
          await writeFile(process.env.GITHUB_OUTPUT, 'sha=' + createHash('sha256').update(plan).digest('hex') + '\n', { flag: 'a' });
          NODE
      - name: Upload synthetic plan
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-smoke-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan.json
          retention-days: 1
          if-no-files-found: error
  runtime:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/phase
      - name: Validate plan and create synthetic runtime receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { readBoxPlan, makeBoxReceipt } from './scripts/qualification/box-phase-contract.mjs';
          const bytes = await readFile(process.env.RUNNER_TEMP + '/phase/plan.json');
          if (createHash('sha256').update(bytes).digest('hex') !== process.env.EXPECTED_SHA) throw new Error('plan mismatch');
          const plan = readBoxPlan(bytes);
          const receipt = makeBoxReceipt(bytes, 'runtime', process.env.GITHUB_RUN_ID, Number(process.env.GITHUB_RUN_ATTEMPT), plan.assets.runtime);
          await writeFile(process.env.RUNNER_TEMP + '/runtime.json', receipt);
          NODE
      - name: Upload synthetic receipt
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-smoke-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime.json
          retention-days: 1
          if-no-files-found: error
  resources:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/phase
      - name: Validate plan and create synthetic resources receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { readBoxPlan, makeBoxReceipt } from './scripts/qualification/box-phase-contract.mjs';
          const bytes = await readFile(process.env.RUNNER_TEMP + '/phase/plan.json');
          if (createHash('sha256').update(bytes).digest('hex') !== process.env.EXPECTED_SHA) throw new Error('plan mismatch');
          const plan = readBoxPlan(bytes);
          const receipt = makeBoxReceipt(bytes, 'resources', process.env.GITHUB_RUN_ID, Number(process.env.GITHUB_RUN_ATTEMPT), plan.assets.resources);
          await writeFile(process.env.RUNNER_TEMP + '/resources.json', receipt);
          NODE
      - name: Upload synthetic receipt
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-smoke-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resources.json
          retention-days: 1
          if-no-files-found: error
  downloads:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      receipt: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/phase
      - name: Validate plan and create synthetic downloads receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { readBoxPlan, makeBoxReceipt } from './scripts/qualification/box-phase-contract.mjs';
          const bytes = await readFile(process.env.RUNNER_TEMP + '/phase/plan.json');
          if (createHash('sha256').update(bytes).digest('hex') !== process.env.EXPECTED_SHA) throw new Error('plan mismatch');
          const plan = readBoxPlan(bytes);
          const receipt = makeBoxReceipt(bytes, 'downloads', process.env.GITHUB_RUN_ID, Number(process.env.GITHUB_RUN_ATTEMPT), plan.assets.downloads);
          await writeFile(process.env.RUNNER_TEMP + '/downloads.json', receipt);
          NODE
      - name: Upload synthetic receipt
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-smoke-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloads.json
          retention-days: 1
          if-no-files-found: error
  finalize:
    needs: [prepare, runtime, resources, downloads]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/phase
      - name: Download runtime receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.runtime.outputs.receipt }}
          path: ${{ runner.temp }}/phase
      - name: Download resources receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.resources.outputs.receipt }}
          path: ${{ runner.temp }}/phase
      - name: Download downloads receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.downloads.outputs.receipt }}
          path: ${{ runner.temp }}/phase
      - name: Verify all exact receipts
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { assertBoxReceipt } from './scripts/qualification/box-phase-contract.mjs';
          const dir = process.env.RUNNER_TEMP + '/phase';
          const plan = await readFile(dir + '/plan.json');
          if (createHash('sha256').update(plan).digest('hex') !== process.env.EXPECTED_SHA) throw new Error('plan mismatch');
          for (const lane of ['runtime', 'resources', 'downloads']) assertBoxReceipt(plan, await readFile(dir + '/' + lane + '.json'), lane, process.env.GITHUB_RUN_ID, Number(process.env.GITHUB_RUN_ATTEMPT));
          NODE
