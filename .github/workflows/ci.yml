name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  QUALIFICATION_BUILD_ROOT: ${{ github.workspace }}/.agent-tmp/release-lane-verification
  RELEASE_LABEL: RESEARCH
jobs:
  verify:
    name: verify / ${{ matrix.lane }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [setup, core-setup]
    env:
      SOURCE_SHA: 678e54ccd32c0bf6e52d1ad8d4a0183b99b25eaf
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_SHA256: f8ee76408ec92c1a61e3dbc2f21b18f7406c6cec38907c5a713dd43906879f3c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          run-id: 38030387152
          github-token: ${{ github.token }}
          path: ${{ env.QUALIFICATION_BUILD_ROOT }}
      - name: Verify original qualification provenance
        shell: pwsh
        run: |
          foreach ($name in @('release-manifest.json','core-release-manifest.json','Mizar-v1.2.0-Windows-x64.zip','Mizar-v1.2.0-Windows-x64-Core.zip')) {
            gh attestation verify (Join-Path $env:QUALIFICATION_BUILD_ROOT $name) --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release-qualification.yml@refs/heads/main" --source-ref refs/heads/main --source-digest $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Original qualified candidate proof failed' }
          }
      - name: Verify candidate transfer before extraction
        run: node scripts/qualification/verify-candidate.mjs "$env:QUALIFICATION_BUILD_ROOT" "$env:SOURCE_SHA" "$env:ARCHIVE_SHA256"
      - name: Extract portable bundle and smoke test
        if: ${{ matrix.lane == 'portable' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          $manifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          $archive = Get-Item -LiteralPath (Join-Path $env:QUALIFICATION_BUILD_ROOT $manifest.archive)
          if ($null -eq $archive) { throw '未生成 qualification ZIP' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'qualification extracted path'
          if (Test-Path -LiteralPath $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }
          & ./scripts/qualification/extract-windows-shell.ps1 -Archive $archive.FullName -Destination $extractRoot
          $bundleRoot = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          if ($null -eq $bundleRoot) { throw '未能解压 qualification bundle 根目录' }
          Push-Location $bundleRoot.FullName
          try {
            foreach ($name in @('LICENSE', 'THIRD-PARTY-NOTICES.md')) {
              if (!(Test-Path -LiteralPath (Join-Path $bundleRoot.FullName $name))) { throw "缺少许可文件：$name" }
            }
            & .\resources\runtime\node.exe ($env:GITHUB_WORKSPACE + '\scripts\qualification\verify-c4-resources.mjs') (Join-Path $bundleRoot.FullName 'resources/app') | Tee-Object -FilePath (Join-Path $env:QUALIFICATION_BUILD_ROOT 'c4-resources.log')
            if ($LASTEXITCODE -ne 0) { throw 'installed C4 资源校验失败' }
            & .\resources\runtime\node.exe ($env:GITHUB_WORKSPACE + '\scripts\qualification\product-smoke.mjs') $bundleRoot.FullName | Tee-Object -FilePath (Join-Path $env:QUALIFICATION_BUILD_ROOT 'portable-smoke.log')
            if ($LASTEXITCODE -ne 0) { throw '便携 EXE smoke 失败' }
            & .\resources\runtime\node.exe ($env:GITHUB_WORKSPACE + '\scripts\qualification\desktop-smoke.mjs') $bundleRoot.FullName (Join-Path $env:QUALIFICATION_BUILD_ROOT 'desktop-smoke.json')
            if ($LASTEXITCODE -ne 0) { throw '正常桌面 GUI cold-start smoke 失败' }
          } finally {
            Pop-Location
          }

      - name: Measure installed C4 worker responsiveness
        if: ${{ matrix.lane == 'portable' }}
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'qualification extracted path') -Directory | Select-Object -First 1
          & (Join-Path $bundle.FullName 'resources/runtime/node.exe') scripts/qualification/c4-worker-benchmark.mjs (Join-Path $bundle.FullName 'resources/app') (Join-Path $env:QUALIFICATION_BUILD_ROOT 'c4-worker-benchmark.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed C4 worker probe failed' }

      - name: Run 3-map exact-artifact synthetic lifecycle soak
        if: ${{ matrix.lane == 'portable' }}
        shell: pwsh
        run: |
          $extractedRoot = Join-Path $env:RUNNER_TEMP 'qualification extracted path'
          $bundleRoot = Get-ChildItem -LiteralPath $extractedRoot -Directory | Select-Object -First 1
          if ($null -eq $bundleRoot) { throw '未找到解压后的便携产品包' }
          $reportPath = Join-Path $env:QUALIFICATION_BUILD_ROOT 'host-soak.json'
          node scripts/qualification/product-soak.mjs $bundleRoot.FullName $reportPath
          if ($LASTEXITCODE -ne 0) { throw 'exact-artifact 三地图合成生命周期 soak 失败' }

      - name: Extract pristine candidate for Setup
        if: ${{ matrix.lane == 'setup' }}
        shell: pwsh
        run: |
          $manifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          $extractRoot = Join-Path $env:RUNNER_TEMP 'qualification extracted path'
          & ./scripts/qualification/extract-windows-shell.ps1 -Archive (Join-Path $env:QUALIFICATION_BUILD_ROOT $manifest.archive) -Destination $extractRoot
      - name: Install pinned NSIS
        if: ${{ matrix.lane != 'portable' }}
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress

      - name: Verify native update cancellation and recovery
        if: ${{ matrix.lane != 'portable' }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          node scripts/qualification/verify-update-recovery.mjs | Tee-Object -FilePath (Join-Path $env:QUALIFICATION_BUILD_ROOT 'update-recovery.log')
          if ($LASTEXITCODE -ne 0) { throw 'Native update recovery failed' }

      - name: Build and verify same-content NSIS installer
        if: ${{ matrix.lane == 'setup' }}
        shell: pwsh
        timeout-minutes: 15
        run: |
          $bundle = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'qualification extracted path') -Directory | Select-Object -First 1
          $extractRoot = Join-Path $env:RUNNER_TEMP 'setup extracted path'
          & ./scripts/qualification/create-windows-setup.ps1 -BundleRoot $bundle.FullName -OutputRoot $env:QUALIFICATION_BUILD_ROOT -ExtractRoot $extractRoot -CaptureUi
          $extracted = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          node scripts/qualification/product-smoke.mjs $extracted.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Setup portable smoke failed' }
          node scripts/qualification/desktop-smoke.mjs $extracted.FullName (Join-Path $env:QUALIFICATION_BUILD_ROOT 'setup-desktop-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Setup desktop GUI smoke failed' }

      - name: Qualify distinct Core payload and real NSIS installation
        if: ${{ matrix.lane == 'core-setup' }}
        shell: pwsh
        run: |
          $core = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-release-manifest.json') -Raw | ConvertFrom-Json
          $coreExtract = Join-Path $env:RUNNER_TEMP 'core candidate extracted'
          ./scripts/qualification/extract-windows-shell.ps1 -Archive (Join-Path $env:QUALIFICATION_BUILD_ROOT $core.archive) -Destination $coreExtract
          $payload = @(Get-ChildItem -LiteralPath $coreExtract -Directory)
          if ($payload.Count -ne 1) { throw 'Core extraction is ambiguous' }
          $installed = Join-Path $env:RUNNER_TEMP 'core installed qualification'
          ./scripts/qualification/create-windows-setup.ps1 -BundleRoot $payload[0].FullName -OutputRoot $env:QUALIFICATION_BUILD_ROOT -ExtractRoot $installed -ManifestName core-release-manifest.json -DistributionName core-distribution-manifest.json
          $root = @(Get-ChildItem -LiteralPath $installed -Directory)
          if ($root.Count -ne 1) { throw 'Core installation is ambiguous' }
          node scripts/qualification/verify-core-candidate.mjs $env:QUALIFICATION_BUILD_ROOT $root[0].FullName $env:SOURCE_SHA (Join-Path $env:QUALIFICATION_BUILD_ROOT "core-setup-identity.json")
          if ($LASTEXITCODE -ne 0) { throw 'Core identity or resource boundary failed' }
          node scripts/qualification/product-smoke.mjs $root[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Real installed Core startup failed' }
          node scripts/qualification/desktop-smoke.mjs $root[0].FullName (Join-Path $env:QUALIFICATION_BUILD_ROOT 'core-desktop-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Real Core desktop startup failed' }

      - name: Recover cancellation and interrupted real Zlib writer in isolated installation
        shell: pwsh
        run: |
          $installed = if ('${{ matrix.lane }}' -eq 'setup') { Join-Path $env:RUNNER_TEMP 'setup extracted path' } else { Join-Path $env:RUNNER_TEMP 'core installed qualification' }
          $root = @(Get-ChildItem -LiteralPath $installed -Directory)
          if ($root.Count -ne 1) { throw 'Isolated recovery root ambiguous' }
          node scripts/qualification/research-real-zlib-recovery.mjs $env:QUALIFICATION_BUILD_ROOT $root[0].FullName '${{ matrix.lane }}'
          if ($LASTEXITCODE -ne 0) { throw 'Real Zlib writer recovery failed' }
          node scripts/qualification/product-smoke.mjs $root[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Recovered exact artifact runtime failed' }
          node scripts/qualification/desktop-smoke.mjs $root[0].FullName (Join-Path $env:QUALIFICATION_BUILD_ROOT 'recovered-desktop-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Recovered GUI failed' }

      - name: Record successful lane identity
        if: ${{ matrix.lane != 'core-setup' }}
        shell: pwsh
        env:
          LANE: ${{ matrix.lane }}
        run: |
          $extractRoot = if ($env:LANE -eq 'setup') { Join-Path $env:RUNNER_TEMP 'setup extracted path' } else { Join-Path $env:RUNNER_TEMP 'qualification extracted path' }
          $manifest = Get-Content (Join-Path $env:QUALIFICATION_BUILD_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          node scripts/qualification/verify-promotion.mjs $env:QUALIFICATION_BUILD_ROOT $extractRoot "v$($manifest.appVersion)" $env:SOURCE_SHA (Join-Path $env:QUALIFICATION_BUILD_ROOT "$env:LANE-identity.json")
          if ($LASTEXITCODE -ne 0) { throw 'Lane identity verification failed' }

      - name: Collect qualification evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'release-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          foreach ($name in @('real-zlib-recovery.json', 'recovered-desktop-smoke.json', 'host-soak.json', 'desktop-smoke.json', 'release-manifest.json', 'c4-resources.log', 'portable-smoke.log', 'distribution-manifest.json', 'setup-desktop-smoke.json', 'core-desktop-smoke.json', 'core-release-manifest.json', 'core-distribution-manifest.json', 'c4-worker-benchmark.json', 'portable-identity.json', 'setup-identity.json', 'core-setup-identity.json', 'update-recovery.log')) {
            $path = Join-Path $env:QUALIFICATION_BUILD_ROOT $name
            if (Test-Path -LiteralPath $path) { Copy-Item -LiteralPath $path -Destination $evidenceRoot }
          }
          $extractedRoot = if ('${{ matrix.lane }}' -eq 'setup') { Join-Path $env:RUNNER_TEMP 'setup extracted path' } elseif ('${{ matrix.lane }}' -eq 'core-setup') { Join-Path $env:RUNNER_TEMP 'core installed qualification' } else { Join-Path $env:RUNNER_TEMP 'qualification extracted path' }
          if (Test-Path -LiteralPath $extractedRoot) {
            $bundle = Get-ChildItem -LiteralPath $extractedRoot -Directory | Select-Object -First 1
            if ($null -ne $bundle) {
              Copy-Item -LiteralPath (Join-Path $bundle.FullName 'resources/metadata') -Destination $evidenceRoot -Recurse
              $statePath = Join-Path $bundle.FullName 'state'
              if (Test-Path -LiteralPath $statePath) {
                # Preserve diagnostics at relative paths without bundling runtime state or secrets.
                Get-ChildItem -LiteralPath $statePath -Recurse -File | Where-Object { $_.FullName -match '[\\/]logs[\\/]' } | ForEach-Object {
                  $target = Join-Path $evidenceRoot ([IO.Path]::GetRelativePath($bundle.FullName, $_.FullName))
                  New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
                  Copy-Item -LiteralPath $_.FullName -Destination $target
                }
              }
            }
          }
          if ('${{ matrix.lane }}' -eq 'setup') {
            $installerUi = Join-Path (Split-Path $env:QUALIFICATION_BUILD_ROOT -Parent) 'installer-ui'
            if (Test-Path -LiteralPath $installerUi) { Copy-Item -LiteralPath $installerUi -Destination (Join-Path $evidenceRoot 'installer-ui') -Recurse }
          }
          $evidenceName = 'Mizar-' + $env:RELEASE_LABEL + '-${{ matrix.lane }}-evidence.zip'
          Compress-Archive -Path (Join-Path $evidenceRoot '*') -DestinationPath (Join-Path $env:RUNNER_TEMP $evidenceName)

      - name: Upload release qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.lane }}
          path: ${{ runner.temp }}/Mizar-*-evidence.zip
          if-no-files-found: error
