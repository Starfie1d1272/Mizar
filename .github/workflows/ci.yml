name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_recovery:
        description: Run explicit native update recovery fixtures on a clean Windows runner
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/screenshots/
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/ci/tests.mjs product
      - run: pnpm typecheck
      - name: Start built service, open main page and stop
        env:
          CHROME_BIN: google-chrome
        run: pnpm local-web:production-smoke
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/screenshots/
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release-notes:check
      - run: pnpm architecture:check
      - run: pnpm format:check
      - run: pnpm exec eslint . --max-warnings=0
      - run: node scripts/ci/tests.mjs scripts
  native:
    name: native build / Windows
    runs-on: windows-2025
    # Keep the 180 s feedback objective in ci-gate; cold toolchain builds must still finish.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          # checkout uses blob:none for sparse checkout; keep full trees for the diff below.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.gitignore
            /.cargo/
            /rust-toolchain
            /rust-toolchain.toml
            /.github/actions/cargo-cache/
            /.github/actions/save-cargo-cache/
            /scripts/ci/cargo-cache-key.mjs
            /scripts/architecture/windows-ipc-acl.mjs
            /scripts/web-installer/
            /config/distribution.json
            /apps/desktop/src-tauri/
            /apps/desktop/installer/
            /packages/protocol/src/desktop-ipc.generated.ts
            /apps/companion/src/match-context/lifecycle-contract.json
            /scripts/qualification/bundle/gsi-discovery.ps1
            /config/mizar_observer.cfg
      - name: Select native build
        id: select
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          native=true
          installer=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$PR_BASE" "$GITHUB_SHA" -- apps/desktop/src-tauri apps/desktop/installer packages/protocol/src/desktop-ipc.generated.ts apps/companion/src/match-context/lifecycle-contract.json scripts/qualification/bundle/gsi-discovery.ps1 config/mizar_observer.cfg scripts/ci/cargo-cache-key.mjs scripts/architecture/windows-ipc-acl.mjs .cargo rust-toolchain rust-toolchain.toml .github/actions/cargo-cache .github/actions/save-cargo-cache .github/workflows/ci.yml; then
              native=false
            else
              result=$?
              if [ "$result" -ne 1 ]; then echo "Cannot determine native changes" >&2; exit "$result"; fi
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$PR_BASE" "$GITHUB_SHA" -- scripts/web-installer config/distribution.json .github/workflows/ci.yml; then
              installer=false
            else
              result=$?
              if [ "$result" -ne 1 ]; then echo "Cannot determine installer changes" >&2; exit "$result"; fi
            fi
          fi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native build required: $native"
      - name: Compile WebInstaller C# sources
        if: steps.select.outputs.installer == 'true'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $sources = @(Get-ChildItem -LiteralPath 'scripts/web-installer' -Filter '*.cs' | ForEach-Object { $_.FullName })
          $distConfig = (Resolve-Path -LiteralPath 'config/distribution.json').Path
          $output = Join-Path $env:RUNNER_TEMP 'Mizar-WebInstaller-compile.exe'
          & $compiler /nologo /target:winexe /optimize+ /platform:anycpu "/out:$output" "/resource:$distConfig,distribution.json" /r:System.Net.Http.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll @sources
          if ($LASTEXITCODE -ne 0) { throw 'WebInstaller C# compilation failed' }
      - uses: ./.github/actions/cargo-cache
        id: cargo-cache
        if: steps.select.outputs.native == 'true'
        with:
          profile: ci
      - name: Build Host and check generated Windows IPC capabilities
        if: steps.select.outputs.native == 'true'
        shell: pwsh
        run: |
          $messages = cargo build --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml --message-format=json-render-diagnostics
          if ($LASTEXITCODE -ne 0) { $messages; exit $LASTEXITCODE }
          $hostBuild = @($messages | ConvertFrom-Json | Where-Object { $_.reason -eq 'build-script-executed' -and $_.package_id -match '#mizar-desktop@' })
          if ($hostBuild.Count -ne 1) { throw 'Desktop build did not report its capability output directory' }
          node scripts/architecture/windows-ipc-acl.mjs (Join-Path $hostBuild[0].out_dir 'capabilities.json')
      - if: steps.select.outputs.native == 'true'
        run: cargo clippy --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D clippy::correctness -D clippy::suspicious
      - if: steps.select.outputs.native == 'true'
        run: cargo build --profile ci --manifest-path apps/desktop/installer/Cargo.toml
      - if: steps.select.outputs.native == 'true'
        run: cargo clippy --profile ci --manifest-path apps/desktop/installer/Cargo.toml -- -D clippy::correctness -D clippy::suspicious
      - if: steps.select.outputs.native == 'true'
        run: cargo check --profile ci --manifest-path apps/desktop/installer/Cargo.toml --workspace --features mizar-applier/ui-preview
      - name: Save Cargo caches on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.select.outputs.native == 'true'
        uses: ./.github/actions/save-cargo-cache
        with:
          profile: ci
          registry-key: ${{ steps.cargo-cache.outputs.registry-key }}
          registry-hit: ${{ steps.cargo-cache.outputs.registry-hit }}
          target-key: ${{ steps.cargo-cache.outputs.target-key }}
          target-hit: ${{ steps.cargo-cache.outputs.target-hit }}
  update-recovery:
    name: explicit update recovery / Windows
    if: github.event_name == 'workflow_dispatch' && inputs.update_recovery
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - name: Build installer binaries
        run: cargo build --profile ci --manifest-path apps/desktop/installer/Cargo.toml --workspace --features mizar-applier/ui-preview
      - name: Verify native update and recovery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .agent-tmp -Force | Out-Null
          node scripts/qualification/verify-update-recovery.mjs 2>&1 | Tee-Object .agent-tmp/update-recovery.log
          if ($LASTEXITCODE -ne 0) { throw 'Native update recovery verification failed' }
      - name: Preserve native verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-recovery-evidence
          path: |
            .agent-tmp/update-recovery.log
            .agent-tmp/update-window/
          retention-days: 14
  ci-gate:
    name: ci-gate
    if: always()
    needs: [build, quality, native, update-recovery]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks and report elapsed time
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.result }}
          NATIVE: ${{ needs.native.result }}
          QUALITY: ${{ needs.quality.result }}
          UPDATE_RECOVERY: ${{ needs.update-recovery.result }}
        run: |
          elapsed=
          {
            if created=$(timeout 10s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) &&
              started=$(date -u -d "$created" +%s); then
              elapsed=$(( $(date -u +%s) - started ))
              echo "CI attempt ${GITHUB_RUN_ATTEMPT}, created to gate: ${elapsed}s (P95 target: 180s)"
              if jobs=$(timeout 10s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"); then
                jq -r --argjson started "$started" '
                  .jobs[] | select(.name != "ci-gate" and .started_at and .completed_at) |
                  "- \(.name): \(.conclusion // .status), workflow creation to runner \((.started_at | fromdateiso8601) - $started)s, run \((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))s" +
                  ([.steps[] | select(.conclusion == "failure") | .name] | if length > 0 then ", failed: " + join(", ") else "" end)
                ' <<< "$jobs" || echo "Job timing unavailable."
              else
                echo "Job timing unavailable."
              fi
            else
              echo "Workflow timing unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${elapsed:-0}" -gt 180 ]; then
            echo "::warning::CI feedback took ${elapsed}s; inspect runner wait and job duration."
          fi
          if [ "$BUILD" != success ] || [ "$QUALITY" != success ] || [ "$NATIVE" != success ]; then
            echo "::error::Required jobs must succeed (build=$BUILD, quality=$QUALITY, native=$NATIVE)"
            exit 1
          fi
          test "$UPDATE_RECOVERY" = skipped || test "$UPDATE_RECOVERY" = success
