name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      run_quality: ${{ steps.plan.outputs.run_quality }}
      run_design: ${{ steps.plan.outputs.run_design }}
      run_acceptance: ${{ steps.plan.outputs.run_acceptance }}
      run_platform: ${{ steps.plan.outputs.run_platform }}
      run_qualification: ${{ steps.plan.outputs.run_qualification }}
      run_offline_qualification: ${{ steps.plan.outputs.run_offline_qualification }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record GitHub simulation identity before executing repository code
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const identity = { repository: process.env.GITHUB_REPOSITORY, event: process.env.GITHUB_EVENT_NAME,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            pr: process.env.PR_NUMBER, base: process.env.PR_BASE, head: process.env.PR_HEAD,
            commit: git('rev-parse', 'HEAD'), tree: git('rev-parse', 'HEAD^{tree}') };
          if (identity.commit !== process.env.GITHUB_SHA) throw new Error('checkout differs from GitHub tested commit');
          console.log('CI_SOURCE_IDENTITY=' + JSON.stringify(identity));
          NODE

      - name: Collect pull request or main push changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
              printf 'X\t\n' > "$RUNNER_TEMP/changed-files.tsv"
            elif git diff --name-status -z --find-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.tsv"; then
              :
            else
              printf 'X\t\n' > "$RUNNER_TEMP/changed-files.tsv"
            fi
          else
            : > "$RUNNER_TEMP/changed-files.tsv"
          fi

      - name: Plan changed-surface evidence
        id: plan
        run: node scripts/ci/plan.mjs
        env:
          CHANGED_FILES_FILE: ${{ runner.temp }}/changed-files.tsv
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          # Remains off until a trusted-main PR proves live merge-tree reuse.
          CI_MERGE_REUSE_ENABLED: 'false'

  quality:
    name: quality / ${{ matrix.lane }}
    if: ${{ needs.plan.outputs.run_quality == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [static, unit, fixtures, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks
        if: ${{ matrix.lane == 'static' }}
        run: |
          pnpm format:check
          pnpm lint
          pnpm architecture:check

      - name: Unit and contract tests
        if: ${{ matrix.lane == 'unit' }}
        run: pnpm test

      - name: Verify generated assets and real-derived fixtures
        if: ${{ matrix.lane == 'fixtures' }}
        run: |
          pnpm cs2-assets:verify
          pnpm fixtures:program:verify
          pnpm fixtures:epl:verify
          pnpm fixtures:epl-rehearsal:verify
          pnpm fixtures:radar:verify
          pnpm fixtures:replay:verify

      - name: Typecheck and build
        if: ${{ matrix.lane == 'build' }}
        run: |
          pnpm typecheck
          pnpm build

      - name: Verify Radar release guards and standalone consumer
        if: ${{ matrix.lane == 'build' }}
        run: |
          pnpm exec vitest run scripts/radar-view/release.test.mjs
          node scripts/radar-view/consumer-smoke.mjs

      - name: Upload verified Radar npm artifact
        if: ${{ matrix.lane == 'build' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-view-${{ github.event.pull_request.head.sha || github.sha }}
          path: .agent-tmp/radar-package/
          if-no-files-found: error
          retention-days: 30

      - name: Production Web host smoke
        if: ${{ matrix.lane == 'build' }}
        timeout-minutes: 2
        run: pnpm local-web:production-smoke

  design:
    name: design
    if: ${{ needs.plan.outputs.run_design == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify design tokens
        run: |
          pnpm design:tokens:verify

      - name: Architecture and contracts when quality is not selected
        if: ${{ needs.plan.outputs.run_quality != 'true' }}
        run: |
          pnpm architecture:check
          pnpm design:contracts:test

      - name: Restore versioned Chromium cache
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-shell-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium and native dependencies
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Record Chromium cache state
        env:
          CHROMIUM_CACHE_HIT: ${{ steps.chromium-cache.outputs.cache-hit }}
        run: echo "Chromium cache exact hit = $CHROMIUM_CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Build canonical component catalog
        run: pnpm design:catalog:build

      - name: Validate component interaction and accessibility
        run: pnpm design:components:test

  acceptance:
    name: acceptance / ${{ matrix.shard }} of 8
    if: ${{ needs.plan.outputs.run_acceptance == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore versioned Chromium cache
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-shell-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium and native dependencies
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Record Chromium cache state
        env:
          CHROMIUM_CACHE_HIT: ${{ steps.chromium-cache.outputs.cache-hit }}
        run: echo "Chromium cache exact hit = $CHROMIUM_CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Run HUD Replay browser acceptance
        run: pnpm acceptance:ci --shard=${{ matrix.shard }}/8
        env:
          MIZAR_BROWSER_SHARDING: balanced

      - name: Build and run production Companion to Chromium closure
        if: ${{ matrix.shard == 8 }}
        timeout-minutes: 2
        run: |
          pnpm --filter @mizar/companion... --filter @mizar/web... --fail-if-no-match run build
          pnpm local-web:production-browser-smoke

      - name: Preserve browser test identities and production evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .agent-tmp/test-evidence/**
            .agent-tmp/production-browser-smoke/**
          if-no-files-found: error

      - name: Upload browser acceptance diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-acceptance-diagnostics-${{ matrix.shard }}
          path: |
            playwright-acceptance-report/**
            test-results/**
          if-no-files-found: warn

  platform:
    name: platform / ${{ matrix.name }}
    if: ${{ needs.plan.outputs.run_platform == 'true' }}
    needs: [plan]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Offline already owns the same macOS build/type/consumer contracts.
        include: ${{ fromJSON(needs.plan.outputs.run_offline_qualification == 'true' && '[{"name":"Windows","runner":"windows-2025"}]' || '[{"name":"macOS","runner":"macos-15"},{"name":"Windows","runner":"windows-2025"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check platform types and build production packages
        run: |
          pnpm typecheck
          pnpm build

      - name: Test OS-sensitive filesystem, process and transport behavior
        run: node scripts/ci/platform-contracts.mjs

      - name: Preserve platform consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-evidence-${{ matrix.name }}
          include-hidden-files: true
          path: .agent-tmp/platform-evidence/**
          if-no-files-found: error

      - name: Production Web host smoke
        timeout-minutes: 2
        run: pnpm local-web:production-smoke

  qualification_windows:
    name: native / Windows
    if: ${{ needs.plan.outputs.run_qualification == 'true' }}
    needs: [plan]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false

      - name: Restore Cargo dependency and profile caches
        id: cargo-cache
        uses: ./.github/actions/cargo-cache
        with:
          profile: ci

      - name: Compile and test the actual Windows host
        shell: pwsh
        run: cargo test --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify native update cancellation and recovery
        shell: pwsh
        timeout-minutes: 5
        run: node scripts/qualification/verify-update-recovery.mjs

      - name: Save reusable main Cargo caches
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: ./.github/actions/save-cargo-cache
        with:
          profile: ci
          registry-key: ${{ steps.cargo-cache.outputs.registry-key }}
          registry-hit: ${{ steps.cargo-cache.outputs.registry-hit }}
          target-key: ${{ steps.cargo-cache.outputs.target-key }}
          target-hit: ${{ steps.cargo-cache.outputs.target-hit }}

  qualification_offline:
    name: qualification / offline / ${{ matrix.name }}
    if: ${{ needs.plan.outputs.run_offline_qualification == 'true' }}
    needs: [plan]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run offline qualification
        run: >-
          node scripts/qualification/offline.mjs
          ${{ needs.plan.outputs.run_quality == 'true' && '--platform-only --quality-owned-static-checks' || '' }}

      - name: Production Web host smoke
        timeout-minutes: 2
        run: pnpm local-web:production-smoke

      - name: Preserve offline phase measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-evidence-${{ matrix.name }}
          include-hidden-files: true
          path: .agent-tmp/offline-evidence/**
          if-no-files-found: error

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [plan, quality, design, acceptance, platform, qualification_offline, qualification_windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download browser identity evidence
        if: ${{ needs.plan.outputs.run_acceptance == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: browser-evidence-*
          path: .agent-tmp/browser-shards

      - name: Verify all browser shards cover FULL exactly once
        if: ${{ needs.plan.outputs.run_acceptance == 'true' }}
        run: node scripts/ci/verify-browser-shards.mjs .agent-tmp/browser-shards 8

      - name: Validate planner-selected jobs
        run: node scripts/ci/plan.mjs --gate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DESIGN_RESULT: ${{ needs.design.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          QUALIFICATION_OFFLINE_RESULT: ${{ needs.qualification_offline.result }}
          QUALIFICATION_WINDOWS_RESULT: ${{ needs.qualification_windows.result }}
