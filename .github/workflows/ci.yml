name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/screenshots/
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/ci/tests.mjs product
      - run: pnpm typecheck
      - name: Start built service, open main page and stop
        env:
          CHROME_BIN: google-chrome
        run: pnpm local-web:production-smoke
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/screenshots/
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release-notes:check
      - run: pnpm architecture:check
      - run: pnpm format:check
      - run: pnpm exec prettier --check '.github/**/*.{yml,yaml}'
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: pnpm exec eslint . --max-warnings=0
      - run: node scripts/ci/tests.mjs scripts
  native:
    name: native build / Windows
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          # checkout uses blob:none for sparse checkout; keep full trees for the diff below.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.gitignore
            /.cargo/
            /rust-toolchain
            /rust-toolchain.toml
            /.github/actions/cargo-cache/
            /.github/actions/save-cargo-cache/
            /scripts/ci/cargo-cache-key.mjs
            /scripts/web-installer/Bootstrap.cs
            /scripts/web-installer/Nsis.cs
            /apps/desktop/src-tauri/
            /apps/web/src/workspace/desktop-commands.generated.ts
            /packages/protocol/src/desktop-ipc.generated.ts
            /apps/companion/src/match-context/lifecycle-contract.json
            /scripts/qualification/bundle/gsi-discovery.ps1
            /config/mizar_observer.cfg
      - name: Select native build
        id: select
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          native=true
          installer=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$PR_BASE" "$GITHUB_SHA" -- apps/desktop/src-tauri apps/web/src/workspace/desktop-commands.generated.ts packages/protocol/src/desktop-ipc.generated.ts apps/companion/src/match-context/lifecycle-contract.json scripts/qualification/bundle/gsi-discovery.ps1 config/mizar_observer.cfg scripts/ci/cargo-cache-key.mjs .cargo rust-toolchain rust-toolchain.toml .github/actions/cargo-cache .github/actions/save-cargo-cache .github/workflows/ci.yml; then
              native=false
            else
              result=$?
              if [ "$result" -ne 1 ]; then echo "Cannot determine native changes" >&2; exit "$result"; fi
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$PR_BASE" "$GITHUB_SHA" -- scripts/web-installer/Bootstrap.cs scripts/web-installer/Nsis.cs scripts/web-installer/build.ps1 .github/workflows/ci.yml; then
              installer=false
            else
              result=$?
              if [ "$result" -ne 1 ]; then echo "Cannot determine installer changes" >&2; exit "$result"; fi
            fi
          fi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native build required: $native"
      - name: Compile WebInstaller C# sources
        if: steps.select.outputs.installer == 'true'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $bootstrap = (Resolve-Path -LiteralPath 'scripts/web-installer/Bootstrap.cs').Path
          $nsis = (Resolve-Path -LiteralPath 'scripts/web-installer/Nsis.cs').Path
          $output = Join-Path $env:RUNNER_TEMP 'Mizar-WebInstaller-compile.exe'
          & $compiler /nologo /target:winexe /optimize+ /platform:anycpu "/out:$output" /r:System.Net.Http.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll $bootstrap $nsis
          if ($LASTEXITCODE -ne 0) { throw 'WebInstaller C# compilation failed' }
      - uses: ./.github/actions/cargo-cache
        id: cargo-cache
        if: steps.select.outputs.native == 'true'
        with:
          profile: ci
      - if: steps.select.outputs.native == 'true'
        run: cargo build --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml
      - if: steps.select.outputs.native == 'true'
        run: cargo clippy --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D clippy::correctness -D clippy::suspicious
      - name: Save Cargo caches on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.select.outputs.native == 'true'
        uses: ./.github/actions/save-cargo-cache
        with:
          profile: ci
          registry-key: ${{ steps.cargo-cache.outputs.registry-key }}
          registry-hit: ${{ steps.cargo-cache.outputs.registry-hit }}
          target-key: ${{ steps.cargo-cache.outputs.target-key }}
          target-hit: ${{ steps.cargo-cache.outputs.target-hit }}
  ci-gate:
    name: ci-gate
    if: always()
    needs: [build, quality, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful builds within 180 seconds
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.result }}
          NATIVE: ${{ needs.native.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "CI created to gate: ${elapsed}s"
          {
            echo "CI attempt ${GITHUB_RUN_ATTEMPT}, created to gate: ${elapsed}s"
            if jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"); then
              jq -r --arg created "$created" '
                .jobs[] | select(.name != "ci-gate") |
                "- \(.name): \(.conclusion // .status), runner wait \((.started_at | fromdateiso8601) - ($created | fromdateiso8601))s, run \((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))s" +
                ([.steps[] | select(.conclusion == "failure") | .name] | if length > 0 then ", failed: " + join(", ") else "" end)
              ' <<< "$jobs" || echo "Job timing unavailable."
            else
              echo "Job timing unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -lt 0 ]; then
            echo "Runner and GitHub timestamps are inconsistent; cannot verify CI budget" >&2
            exit 1
          fi
          test "$BUILD" = success && test "$QUALITY" = success && test "$NATIVE" = success && test "$elapsed" -le 180
