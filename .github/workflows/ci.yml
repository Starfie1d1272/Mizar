name: Isolated real release upgrade acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real_upgrade:
    name: real released 1.3.2 to qualified 1.3.3
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          runtime: node@24
          install: false
      - name: Run original EXE helper NSIS relay with product-written state
        run: node scripts/qualification/verify-release-upgrade.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: real-upgrade-1.3.2-to-1.3.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-tmp/real-upgrade-evidence/**
          if-no-files-found: error
          retention-days: 7
