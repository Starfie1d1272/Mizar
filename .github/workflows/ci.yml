name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Start built service, open main page and stop
        env:
          CHROME_BIN: google-chrome
        run: pnpm local-web:production-smoke
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec prettier --check '.github/**/*.{yml,yaml}'
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: pnpm exec eslint . --max-warnings=0
      - run: node --test scripts/qualification/box-sync.test.mjs scripts/qualification/box-lanes.test.mjs scripts/qualification/build-timings.test.mjs scripts/qualification/build-downloads.test.mjs scripts/qualification/release-timings.test.mjs scripts/qualification/release-identity.test.mjs scripts/qualification/release-assets.test.mjs scripts/qualification/box-phase-contract.test.mjs scripts/qualification/box-phases.test.mjs scripts/qualification/bounded-gh.test.mjs scripts/qualification/upload-release-assets.test.mjs
  native:
    name: native build / Windows
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select native build
        id: select
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          native=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$PR_BASE" "$GITHUB_SHA" -- apps/desktop/src-tauri scripts/qualification/bundle/gsi-discovery.ps1 config/mizar_observer.cfg scripts/ci/cargo-cache-key.mjs .cargo rust-toolchain rust-toolchain.toml .github/actions/cargo-cache .github/actions/save-cargo-cache .github/workflows/ci.yml; then
              native=false
            else
              result=$?
              if [ "$result" -ne 1 ]; then echo "Cannot determine native changes" >&2; exit "$result"; fi
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native build required: $native"
      - uses: ./.github/actions/cargo-cache
        if: steps.select.outputs.native == 'true'
        with:
          profile: ci
      - if: steps.select.outputs.native == 'true'
        run: cargo build --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Record temporary workbench build identity
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 690 && steps.select.outputs.native == 'true'
        shell: pwsh
        run: |
          $exe = 'apps/desktop/src-tauri/target/ci/mizar-desktop.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Windows desktop executable missing' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/workbench-build" | Out-Null
          Copy-Item -LiteralPath $exe -Destination "$env:RUNNER_TEMP/workbench-build/mizar-desktop.exe"
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "SHA256=$digest`nGITHUB_SHA=$env:GITHUB_SHA`nPR_HEAD=${{ github.event.pull_request.head.sha }}`nPROFILE=ci" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/workbench-build/identity.txt"
      - name: Preserve temporary workbench build
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 690 && steps.select.outputs.native == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-ci-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbench-build/*
          if-no-files-found: error
          retention-days: 7
  temporary-workbench-package:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 690
    needs: [native, ci-gate]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - name: Read same-run desktop build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: workbench-ci-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workbench-build
      - name: Assemble and verify temporary portable bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @('.github/workflows/ci.yml', 'scripts/qualification/temporary-workbench-bundle.mjs', 'apps/desktop/src-tauri/build.rs', 'apps/desktop/src-tauri/tauri.conf.json', 'apps/desktop/src-tauri/capabilities/workbench-main.json', 'apps/desktop/src-tauri/capabilities/workbench-dock.json')
          $changed = @(git diff --name-only 77dddfa61fac235fc9da82eab03437c7ad501b99 $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { $_ -notin $allowed }).Count -gt 0) { throw 'Source differs beyond the temporary workbench scope' }
          $build = Join-Path $env:RUNNER_TEMP 'workbench-build'
          $exe = Join-Path $build 'mizar-desktop.exe'
          $identity = Get-Content -Raw -LiteralPath (Join-Path $build 'identity.txt') | ConvertFrom-StringData
          if ($identity.PR_HEAD -ne $env:PR_HEAD -or $identity.GITHUB_SHA -ne $env:GITHUB_SHA -or $identity.PROFILE -ne 'ci' -or $identity.SHA256 -notmatch '^[a-f0-9]{64}$' -or (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant() -ne $identity.SHA256) { throw 'Same-run build identity differs' }
          $dir = Join-Path $env:RUNNER_TEMP 'mizar-temporary'
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download v1.10.2 --repo Starfie1d1272/Mizar --pattern 'Mizar-v1.10.2-Windows-x64.zip' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Original release download failed' }
          $zip = Join-Path $dir 'Mizar-v1.10.2-Windows-x64.zip'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -ne 'ee3ba3879c424e25a8cde28bbd4badd8cfea51cef29a22bcda81c6d25e092ea0') { throw 'Original release digest differs' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'extracted')
          $bundle = Join-Path $dir 'extracted/Mizar-v1.10.2-Windows-x64'
          node scripts/qualification/temporary-workbench-bundle.mjs $bundle $exe $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Temporary bundle integrity verification failed' }
          $out = Join-Path $env:RUNNER_TEMP 'temporary-output'
          New-Item -ItemType Directory -Path $out | Out-Null
          & ./scripts/qualification/create-windows-archive.ps1 -BundleRoot $bundle -ArchivePath (Join-Path $out 'Mizar-1.10.2-workbench-temporary.zip')
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out 'Mizar-1.10.2-workbench-temporary.zip')).Hash.ToLowerInvariant()
          "SHA256=$digest`nGITHUB_SHA=$env:GITHUB_SHA`nPR_HEAD=$env:PR_HEAD`nPROFILE=ci`nUNSIGNED_TEMPORARY_BUILD=true`nORIGINAL_RELEASE_SHA256=ee3ba3879c424e25a8cde28bbd4badd8cfea51cef29a22bcda81c6d25e092ea0" | Set-Content -Encoding utf8 (Join-Path $out 'identity.txt')
      - name: Preserve verified temporary portable bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-temporary-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/temporary-output/*
          if-no-files-found: error
          retention-days: 7
  temporary-workbench-installer:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 690
    needs: ci-gate
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3152bc32eda533dab56add5d01a35229db47d7f7
      - name: Read existing verified temporary bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: workbench-temporary-bundle-41196973340-1
          run-id: 41196973340
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/temporary-bundle
      - name: Build complete temporary installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputDir = Join-Path $env:RUNNER_TEMP 'temporary-bundle'
          $identity = Get-Content -Raw -LiteralPath (Join-Path $inputDir 'identity.txt') | ConvertFrom-StringData
          $zip = Join-Path $inputDir 'Mizar-1.10.2-workbench-temporary.zip'
          if ($identity.PR_HEAD -ne '3152bc32eda533dab56add5d01a35229db47d7f7' -or $identity.UNSIGNED_TEMPORARY_BUILD -ne 'true' -or (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -ne $identity.SHA256) { throw 'Temporary bundle identity differs' }
          $extract = Join-Path $env:RUNNER_TEMP 'temporary-extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $source = Join-Path $extract 'Mizar-v1.10.2-Windows-x64'
          if (!(Test-Path -LiteralPath (Join-Path $source 'Mizar.exe'))) { throw 'Temporary product missing' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if ((& $compiler /VERSION | Out-String).Trim() -ne 'v3.11') { throw 'Unexpected NSIS version' }
          function Escape-Nsis([string]$text) { $text.Replace('$', '$$').Replace('"', '$\"') }
          $remove = Join-Path $env:RUNNER_TEMP 'temporary-remove.nsh'
          $files = @(Get-ChildItem -LiteralPath $source -Recurse -File)
          $lines = @($files | ForEach-Object { 'Delete "$INSTDIR\' + (Escape-Nsis ([IO.Path]::GetRelativePath($source, $_.FullName))) + '"' })
          $lines += @(Get-ChildItem -LiteralPath $source -Recurse -Directory | Sort-Object { $_.FullName.Length } -Descending | ForEach-Object { 'RMDir "$INSTDIR\' + (Escape-Nsis ([IO.Path]::GetRelativePath($source, $_.FullName))) + '"' })
          $lines | Set-Content -LiteralPath $remove -Encoding utf8
          $installer = Join-Path $env:RUNNER_TEMP 'Mizar-1.10.2-workbench-temporary-Setup.exe'
          $icon = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/icons/icon.ico'
          $assets = Join-Path $env:GITHUB_WORKSPACE 'scripts/qualification/installer-assets'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/qualification/windows-setup.nsi'
          & $compiler /INPUTCHARSET UTF8 "/DPAYLOAD=$source" "/DOUTPUT=$installer" '/DVERSION=1.10.2' "/DICON=$icon" "/DINSTALLER_ASSETS=$assets" "/DREMOVE_FILES=$remove" $script
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $installer)) { throw 'Temporary installer compilation failed' }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "TEMP_INSTALLER_SHA256=$digest" >> $env:GITHUB_ENV
      - name: Publish temporary installer on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "temporary-workbench-$env:GITHUB_RUN_ID"
          $installer = Join-Path $env:RUNNER_TEMP 'Mizar-1.10.2-workbench-temporary-Setup.exe'
          $notes = Join-Path $env:RUNNER_TEMP 'temporary-notes.txt'
          @"
          临时现场修复，非正式版本。基于 1.10.2 原资源与工作台权限修复，CI 构建，未经正式发行签名或 Windows/CS2/OBS 实机验收。
          使用前正常退出 Mizar 并备份 %LOCALAPPDATA%\Mizar；直播或录制进行中不要安装。
          安装包 SHA-256: $env:TEMP_INSTALLER_SHA256
          "@ | Set-Content -Encoding utf8 $notes
          gh release create $tag $installer --repo Starfie1d1272/Mizar --target 3152bc32eda533dab56add5d01a35229db47d7f7 --title 'Mizar 工作台临时修复' --notes-file $notes --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Temporary publication failed; reconcile before retry' }
          gh release view $tag --repo Starfie1d1272/Mizar
          if ($LASTEXITCODE -ne 0) { throw 'Temporary publication readback failed' }
  ci-gate:
    name: ci-gate
    if: always()
    needs: [build, quality, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful builds within 180 seconds
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.result }}
          NATIVE: ${{ needs.native.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "CI created to gate: ${elapsed}s"
          test "$BUILD" = success && test "$QUALITY" = success && test "$NATIVE" = success && test "$elapsed" -le 180
