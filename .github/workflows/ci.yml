name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  native:
    name: native build / Windows
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cargo-cache
        with:
          profile: ci
      - run: cargo build --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml
  ci-gate:
    name: ci-gate
    if: always()
    needs: [build, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful builds within 180 seconds
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "CI created to gate: ${elapsed}s"
          test "$BUILD" = success && test "$NATIVE" = success && test "$elapsed" -le 180
