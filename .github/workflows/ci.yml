name: CI
on:
  pull_request:
    branches: [main, development/2.0]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, development/2.0]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/qualification/app-version.mjs
      - run: pnpm -r run typecheck
      - run: pnpm --filter @mizar-hud/radar-view... --fail-if-no-match run consumer:typecheck
      - name: Start built service, open main page and stop
        env:
          CHROME_BIN: google-chrome
        run: pnpm local-web:production-smoke
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec prettier --check '.github/**/*.{yml,yaml}'
      - name: Check Rust formatting
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ "$TARGET" != development/2.0 ]; then
            cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          else
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then BASE=$(git rev-parse "${GITHUB_SHA}^1"); fi
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then BASE=$(git rev-parse "${GITHUB_SHA}^"); fi
            git cat-file -e "${BASE}^{commit}" || { echo 'Cannot determine formatting base' >&2; exit 1; }
            git diff --name-only --diff-filter=ACMR -z "$BASE" "$GITHUB_SHA" -- 'apps/desktop/src-tauri/*.rs' 'apps/desktop/src-tauri/**/*.rs' > /tmp/mizar-rust-files
            while IFS= read -r -d '' file; do
              [ ! -f "$file" ] || rustfmt --check --edition 2021 --config skip_children=true "$file"
            done < /tmp/mizar-rust-files
          fi
      - run: pnpm exec eslint . --ignore-pattern '**/test/**' --ignore-pattern '**/tests/**' --ignore-pattern '**/*.test.*' --max-warnings=0
  native:
    name: native build / Windows
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select native build
        id: select
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          native=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            if git diff --quiet "$PR_BASE" "$GITHUB_SHA" -- apps/desktop/src-tauri scripts/qualification/bundle/gsi-discovery.ps1 config/mizar_observer.cfg scripts/ci/cargo-cache-key.mjs .cargo rust-toolchain rust-toolchain.toml .github/actions/cargo-cache .github/actions/save-cargo-cache .github/workflows/ci.yml; then
              native=false
            else
              result=$?
              if [ "$result" -ne 1 ]; then echo "Cannot determine native changes" >&2; exit "$result"; fi
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native build required: $native"
      - uses: ./.github/actions/cargo-cache
        if: steps.select.outputs.native == 'true'
        with:
          profile: ci
      - if: steps.select.outputs.native == 'true'
        run: cargo build --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml
  ci-gate:
    name: ci-gate
    if: always()
    needs: [build, quality, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful builds within 180 seconds
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.result }}
          NATIVE: ${{ needs.native.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
          echo "CI created to gate: ${elapsed}s"
          test "$BUILD" = success && test "$QUALITY" = success && test "$NATIVE" = success && test "$elapsed" -le 180
