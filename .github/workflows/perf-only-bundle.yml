              if (args.Length != 4 || args[0] != "api" || args[1] != "--hostname" || args[2] != "github.com" || !args[3].StartsWith("/repos/")) return 2;
              try {
                ServicePointManager.SecurityProtocol = SecurityProtocolType.Tls12;
                using (var client = new WebClient()) {
                  client.Headers.Add("User-Agent", "Mizar-PERF-ONLY");
                  client.Headers.Add("Accept", "application/vnd.github+json");
                  var bytes = client.DownloadData("https://api.github.com" + args[3]);
                  using (var output = Console.OpenStandardOutput()) output.Write(bytes, 0, bytes.Length);
                }
                return 0;
              } catch (WebException error) {
                var response = error.Response as HttpWebResponse;
                Console.Error.WriteLine("HTTP " + (response == null ? "unavailable" : ((int)response.StatusCode).ToString()));
