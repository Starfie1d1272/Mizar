      - name: Install frozen dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frozen install failed' }
          git checkout -- pnpm-lock.yaml
      - name: Select candidate source without cleaning restored caches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Prepare public-only metadata reader
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'perf-public-gh'
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          $source = @'
          using System;
          using System.Net;
          public class PerfPublicGh {
