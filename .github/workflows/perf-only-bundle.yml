# Temporary, read-only comparison. Remove after measurements; it cannot promote or publish.
name: PERF-ONLY Bundle Comparison
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/perf-only-bundle.yml]
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    if: github.event.pull_request.head.ref == 'fix/release-time-budget'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PERF_ROOT: ${{ github.workspace }}/.agent-tmp/perf-baseline
      PERF_LANE: baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8b5b63a43137dfeffa8b8bc67838ac42e569c00c
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - name: Restore baseline release dependencies and target cache
        id: cargo
        uses: ./.github/actions/cargo-cache
        with:
          profile: release
      - name: Install frozen dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Frozen install failed' }
          git checkout -- pnpm-lock.yaml
      - name: Prepare public-only metadata reader
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'perf-public-gh'
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          $source = @'
          using System;
          using System.Net;
          public class PerfPublicGh {
            public static int Main(string[] args) {
              if (args.Length != 4 || args[0] != "api" || args[1] != "--hostname" || args[2] != "github.com" || !args[3].StartsWith("/repos/")) return 2;
              try {
                ServicePointManager.SecurityProtocol = SecurityProtocolType.Tls12;
                using (var client = new WebClient()) {
                  client.Headers.Add("User-Agent", "Mizar-PERF-ONLY");
                  client.Headers.Add("Accept", "application/vnd.github+json");
                  var bytes = client.DownloadData("https://api.github.com" + args[3]);
                  using (var output = Console.OpenStandardOutput()) output.Write(bytes, 0, bytes.Length);
                }
                return 0;
              } catch (WebException error) {
                var response = error.Response as HttpWebResponse;
                Console.Error.WriteLine("HTTP " + (response == null ? "unavailable" : ((int)response.StatusCode).ToString()));
                return 1;
              }
            }
          }
          '@
          $sourcePath = Join-Path $tool 'gh.cs'
          Set-Content -LiteralPath $sourcePath -Value $source -Encoding utf8
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $outputPath = Join-Path $tool 'gh.exe'
          & $compiler /nologo /target:exe "/out:$outputPath" $sourcePath
          if ($LASTEXITCODE -ne 0) { throw 'Public-only metadata reader compilation failed' }
          $tool >> $env:GITHUB_PATH
      - name: Force application rebuild with warm dependencies
        shell: pwsh
        run: |
          cargo clean --manifest-path apps/desktop/src-tauri/Cargo.toml -p mizar-desktop --profile release
          if ($LASTEXITCODE -ne 0) { throw 'Cannot invalidate the application build' }
      - name: Build actual release-profile bundle without publishing
        shell: pwsh
        env:
          MIZAR_CARGO_REGISTRY_CACHE_HIT: ${{ steps.cargo.outputs.registry-hit }}
          MIZAR_CARGO_TARGET_CACHE_HIT: ${{ steps.cargo.outputs.target-hit }}
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          node scripts/qualification/build.mjs --output "$env:PERF_ROOT" --label PERF
          $result = $LASTEXITCODE
          $timer.Stop()
          if ($result -ne 0) { throw 'PERF-ONLY bundle build failed' }
          $bundle = @(Get-ChildItem -LiteralPath $env:PERF_ROOT -Directory | Where-Object { $_.Name -like 'Mizar-v*' })
          if ($bundle.Count -ne 1) { throw 'PERF bundle root is ambiguous' }
          $exe = Join-Path $bundle[0].FullName 'Mizar.exe'
          $actualVersion = (& $exe --app-version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read built EXE version' }
          [ordered]@{ lane = $env:PERF_LANE; sourceSha = (git rev-parse HEAD); totalMs = $timer.ElapsedMilliseconds; exeBytes = (Get-Item -LiteralPath $exe).Length; appVersion = $actualVersion; registryHit = '${{ steps.cargo.outputs.registry-hit }}'; targetHit = '${{ steps.cargo.outputs.target-hit }}' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PERF_ROOT 'perf-wall.json') -Encoding utf8NoBOM
          Get-Content (Join-Path $env:PERF_ROOT 'perf-wall.json')
      - name: Verify portable startup on a fresh extraction
        shell: pwsh
        run: |
          $manifest = Get-Content (Join-Path $env:PERF_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          $extract = Join-Path $env:RUNNER_TEMP 'perf-portable-extract'
          & ./scripts/qualification/extract-windows-shell.ps1 -Archive (Join-Path $env:PERF_ROOT $manifest.archive) -Destination $extract
          $bundle = @(Get-ChildItem -LiteralPath $extract -Directory)
          if ($bundle.Count -ne 1) { throw 'Portable extraction is ambiguous' }
          node scripts/qualification/desktop-smoke.mjs $bundle[0].FullName (Join-Path $env:PERF_ROOT 'desktop-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Portable startup failed' }
      - name: Build and verify actual NSIS installation
        shell: pwsh
        run: |
          $manifest = Get-Content (Join-Path $env:PERF_ROOT 'release-manifest.json') -Raw | ConvertFrom-Json
          $extract = Join-Path $env:RUNNER_TEMP 'perf-setup-extract'
          & ./scripts/qualification/prepare-windows-setup.ps1 -Archive (Join-Path $env:PERF_ROOT $manifest.archive) -Destination $extract
          $bundle = @(Get-ChildItem -LiteralPath $extract -Directory)
          if ($bundle.Count -ne 1) { throw 'Setup extraction is ambiguous' }
          $installed = Join-Path $env:RUNNER_TEMP 'perf-installed'
          & ./scripts/qualification/create-windows-setup.ps1 -BundleRoot $bundle[0].FullName -OutputRoot $env:PERF_ROOT -ExtractRoot $installed
          $root = @(Get-ChildItem -LiteralPath $installed -Directory)
          if ($root.Count -ne 1) { throw 'Installed payload is ambiguous' }
          node scripts/qualification/desktop-smoke.mjs $root[0].FullName (Join-Path $env:PERF_ROOT 'installed-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed startup failed' }
      - name: Preserve only non-release measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-only-${{ env.PERF_LANE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PERF_ROOT }}/perf-wall.json
            ${{ env.PERF_ROOT }}/build-timings.json
            ${{ env.PERF_ROOT }}/desktop-smoke.json
            ${{ env.PERF_ROOT }}/installed-smoke.json
            ${{ env.PERF_ROOT }}/setup-timings.json
          retention-days: 1
          if-no-files-found: warn
  candidate:
    if: github.event.pull_request.head.ref == 'fix/release-time-budget'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PERF_ROOT: ${{ github.workspace }}/.agent-tmp/perf-candidate
      PERF_LANE: candidate
    steps:
