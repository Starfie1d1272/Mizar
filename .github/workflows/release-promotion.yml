name: Release Promotion
run-name: ${{ inputs.draft_release_id && format('Stage draft {0}', inputs.tag) || 'Release Promotion' }}
on:
  workflow_call:
    inputs:
      qualification_run:
        required: true
        type: string
      qualification_attempt:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful Release Qualification run ID
        required: true
        type: string
      qualification_attempt:
        description: Exact attempt for a same-run qualification (blank for historical runs)
        required: false
        type: string
      tag:
        description: Exact application version tag (stable, alpha.N, beta.N or rc.N)
        required: true
        type: string
      recovery:
        description: Resume an expired qualified release with a separate recovery budget
        required: false
        default: false
        type: boolean
      draft_release_id:
        description: Stage verified assets into this existing unpublished draft without creating a tag
        required: false
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
concurrency:
  group: release-promotion-${{ inputs.tag || github.event.workflow_run.display_title }}
  cancel-in-progress: false
jobs:
  promote:
    name: 发布 Mizar ${{ inputs.tag || github.event.workflow_run.display_title }}
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      QUALIFICATION_ATTEMPT: ${{ inputs.qualification_attempt }}
      RUN_ID: ${{ inputs.qualification_run || github.event.workflow_run.id }}
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.display_title }}
      RELEASE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery && 'true' || 'false' }}
      RELEASE_DRAFT_ID: ${{ inputs.draft_release_id }}
      RELEASE_BUDGET_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery && github.run_id || inputs.qualification_run || github.event.workflow_run.id }}
      RESOURCE_PUBLISHER_ROOT: ${{ github.workspace }}/.agent-tmp/resource-publisher-source
      RESOURCE_ROOT: ${{ github.workspace }}/qualified-resources
      RESOURCE_FROZEN_ROOT: ${{ github.workspace }}/frozen-resources
    steps:
      - name: Require main promotion workflow
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Promotion must run from main' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - name: Initialize and verify official Sigstore trust caches
        shell: pwsh
        env:
          GH_DEBUG: '1'
        run: |
          gh version
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh attestation trusted-root --verify-only
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Official Sigstore TUF initialization failed; provenance verification remains required' }
            Write-Warning "Official trust cache initialization failed (attempt $attempt); retrying after 10 seconds"
            Start-Sleep -Seconds 10
          }
      - name: Preserve the exact main publication tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path $env:RESOURCE_PUBLISHER_ROOT -Parent) | Out-Null
          git worktree add --detach "$env:RESOURCE_PUBLISHER_ROOT" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Trusted publication tool snapshot failed' }
      - name: Validate explicit recovery
        if: ${{ env.RELEASE_RECOVERY == 'true' }}
        shell: pwsh
        run: |
          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or (!$env:QUALIFICATION_ATTEMPT -and ($run.status -ne 'completed' -or $run.conclusion -ne 'success')) -or $run.event -ne 'workflow_dispatch' -or $run.path -ne '.github/workflows/release-qualification.yml' -or $run.head_branch -ne 'main' -or $run.head_repository.full_name -ne $env:GH_REPO) { throw 'Recovery requires a successful original main qualification' }
          if (([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($run.created_at)).TotalSeconds -le 600) { throw 'Recovery requires the original release budget to have expired' }
          Write-Output 'Explicit recovery: original fresh-release budget was not met.'
      - name: Bound Resolve successful qualification source to remaining time
        id: budget_resolve
        shell: pwsh
        run: |
          $created = gh api "repos/$env:GH_REPO/actions/runs/$env:RELEASE_BUDGET_RUN" --jq .created_at
          if ($LASTEXITCODE -ne 0 -or !$created) { throw 'Cannot read qualification start time' }
          $minutes = [math]::Floor((600 - ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($created)).TotalSeconds) / 60)
          if ($minutes -lt 1) { throw 'Less than one minute remains in release budget' }
          "minutes=$minutes" >> $env:GITHUB_OUTPUT
      - name: Resolve successful qualification source
        timeout-minutes: ${{ fromJSON(steps.budget_resolve.outputs.minutes) }}
        shell: pwsh
        run: |
          if ($env:RUN_ID -notmatch '^\d+$') { throw 'Invalid run ID' }
          if ($env:QUALIFICATION_ATTEMPT -and $env:QUALIFICATION_ATTEMPT -notmatch '^[1-9]\d*$') { throw 'Invalid qualification attempt' }
          $runPath = "repos/$env:GH_REPO/actions/runs/$env:RUN_ID"
          if ($env:QUALIFICATION_ATTEMPT) { $runPath += "/attempts/$env:QUALIFICATION_ATTEMPT" }
          $run = gh api $runPath | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Qualification run lookup failed' }
          if ((!$env:QUALIFICATION_ATTEMPT -and ($run.status -ne 'completed' -or $run.conclusion -ne 'success')) -or $run.path -ne '.github/workflows/release-qualification.yml' -or $run.event -ne 'workflow_dispatch' -or $run.head_branch -ne 'main' -or $run.head_repository.full_name -ne $env:GH_REPO) { throw 'Not a successful main qualification run' }
          $budgetCreated = gh api "repos/$env:GH_REPO/actions/runs/$env:RELEASE_BUDGET_RUN" --jq .created_at
          if ($LASTEXITCODE -ne 0 -or !$budgetCreated) { throw 'Cannot read release budget start time' }
          $elapsed = ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($budgetCreated)).TotalSeconds
          if ($elapsed -gt 600) { throw "Release budget exceeded before promotion: $elapsed seconds" }
          "RELEASE_DEADLINE=$(([DateTimeOffset]::Parse($budgetCreated).AddSeconds(600)).ToString('o'))" >> $env:GITHUB_ENV
          $run | ConvertTo-Json -Depth 50 | Set-Content qualification-run.json -Encoding utf8
          if ($env:QUALIFICATION_ATTEMPT) {
            if ($env:QUALIFICATION_ATTEMPT -notmatch '^[1-9]\d*$' -or $run.run_attempt -ne [int]$env:QUALIFICATION_ATTEMPT) { throw 'Qualification attempt mismatch' }
            gh api "repos/$env:GH_REPO/actions/runs/$env:RUN_ID/attempts/$env:QUALIFICATION_ATTEMPT/jobs?per_page=100" > qualification-jobs.json
            if ($LASTEXITCODE -ne 0) { throw 'Qualification stage lookup failed' }
          }
          node scripts/qualification/download-qualified-artifacts.mjs $env:RUN_ID "$env:RESOURCE_ROOT" $env:QUALIFICATION_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'Qualified product/evidence download failed' }
          if (!(Test-Path -LiteralPath product/qualification-provenance.json -PathType Leaf)) { throw 'Original qualification provenance bundle is required' }
          $manifest = Get-Content product/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.gitSha -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source SHA' }
          if ($env:RELEASE_TAG -ne "v$($manifest.appVersion)") { throw 'Requested tag differs from qualified version' }
          node scripts/qualification/release-identity.mjs promotion qualification-run.json product/release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Qualified product and main signing source differ' }
          # The product, workflow run and all evidence name the same exact source.
          New-Item -ItemType Directory -Path evidence-extracted | Out-Null
          $ev = Get-ChildItem evidence -Filter '*.zip'
          if (@($ev).Count -ne 1) { throw 'Ambiguous evidence' }
          Expand-Archive -LiteralPath $ev.FullName -DestinationPath evidence-extracted
          $evManifest = Get-Content evidence-extracted/release-manifest.json -Raw | ConvertFrom-Json
          foreach ($field in @('gitSha','archiveSha256','contentDigest','appVersion')) { if ($manifest.$field -ne $evManifest.$field) { throw "Evidence mismatch: $field" } }
          "SOURCE_SHA=$($manifest.gitSha)" >> $env:GITHUB_ENV
          "PRODUCT_ARCHIVE=$($manifest.archive)" >> $env:GITHUB_ENV
      - name: Require full CI for the product manifest source
        shell: pwsh
        run: |
          node scripts/qualification/verify-source-ci.mjs product/release-manifest.json promotion-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Full source CI verification failed' }
      - name: Resolve mandatory resources from the qualified source
        shell: pwsh
        run: |
          git fetch --depth 1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source fetch failed' }
          $bridge = git ls-tree $env:SOURCE_SHA -- scripts/ci/resource-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Qualified source resource contract lookup failed' }
          if (!$bridge) {
            'RESOURCE_ENABLED=false' >> $env:GITHUB_ENV
            exit 0
          }
          'RESOURCE_ENABLED=true' >> $env:GITHUB_ENV
          if (Test-Path -LiteralPath "$env:RESOURCE_ROOT.download-failed") { throw 'Resource-aware qualification is missing its original resource artifact' }
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'product/core-release-manifest.json'
          $parameters = Join-Path $env:RUNNER_TEMP 'resource-publication-parameters.json'
          Set-Location -LiteralPath $env:RESOURCE_PUBLISHER_ROOT
          node scripts/ci/resource-release.mjs resolve "$env:RESOURCE_ROOT" "$manifest" "$parameters"
          if ($LASTEXITCODE -ne 0) { throw 'Existing resource publication resolution failed; refusing overwrite' }
      - name: Prepare exact resource publication on the current main tools
        if: ${{ env.RESOURCE_ENABLED == 'true' && env.RESOURCE_RELEASE_EXISTS != 'true' }}
        shell: pwsh
        run: |
          $parameters = Join-Path $env:RUNNER_TEMP 'resource-publication-parameters.json'
          Set-Location -LiteralPath $env:RESOURCE_PUBLISHER_ROOT
          $descriptor = Get-Content (Join-Path $env:RESOURCE_ROOT 'resource-descriptor.json') -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RESOURCE_ROOT $descriptor.resources[0].archive.name
          if (!$descriptor.origin.publication) {
            node scripts/qualification/resource-provenance/create.mjs "$archive" (Join-Path $env:RESOURCE_ROOT 'resource-pack-provenance.json') "$parameters" (Join-Path $env:RESOURCE_ROOT 'resource-publication.json')
            if ($LASTEXITCODE -ne 0) { throw 'Resource publication source/Qualification/CI authorization failed' }
          }
      - name: Attest the publication and trusted resource catalog
        if: ${{ env.RESOURCE_ENABLED == 'true' && env.RESOURCE_RELEASE_EXISTS != 'true' && env.RESOURCE_PUBLICATION_REUSED != 'true' }}
        id: resource-publication-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.RESOURCE_ROOT }}/resource-publication.json
            ${{ env.RESOURCE_ROOT }}/resource-catalog.json
      - name: Attest only renewed Core compatibility catalog
        if: ${{ env.RESOURCE_ENABLED == 'true' && env.RESOURCE_RELEASE_EXISTS != 'true' && env.RESOURCE_PUBLICATION_REUSED == 'true' }}
        id: reused-resource-catalog-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.RESOURCE_ROOT }}/resource-catalog.json
      - name: Freeze only fully verified publication assets
        if: ${{ env.RESOURCE_ENABLED == 'true' }}
        shell: pwsh
        env:
          RESOURCE_PUBLICATION_BUNDLE: ${{ steps.resource-publication-provenance.outputs.bundle-path || steps.reused-resource-catalog-provenance.outputs.bundle-path }}
        run: |
          if ($env:RESOURCE_RELEASE_EXISTS -ne 'true') {
            if ($env:RESOURCE_PUBLICATION_REUSED -ne 'true') { Copy-Item -LiteralPath $env:RESOURCE_PUBLICATION_BUNDLE -Destination (Join-Path $env:RESOURCE_ROOT 'resource-publication-provenance.json') }
            Copy-Item -LiteralPath $env:RESOURCE_PUBLICATION_BUNDLE -Destination (Join-Path $env:RESOURCE_ROOT 'resource-catalog-promotion-provenance.json')
          }
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/ci/resource-release.mjs" freeze "$env:RESOURCE_ROOT" product/core-release-manifest.json "$env:RESOURCE_FROZEN_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Resource archive/publication/catalog verification failed' }
      - name: Preserve original signed resource publication for safe partial-upload retries
        if: ${{ env.RESOURCE_ENABLED == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-resources-${{ env.RELEASE_TAG }}-${{ env.RUN_ID }}-${{ github.run_attempt }}
          path: ${{ env.RESOURCE_FROZEN_ROOT }}/*
          compression-level: 0
          if-no-files-found: error
      - name: Checkout the qualified source (no rebuild)
        shell: pwsh
        run: |
          git checkout --detach $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
      - name: Verify original ZIP, payload, compiled version and tag
        shell: pwsh
        run: |
          & (Join-Path $env:RESOURCE_PUBLISHER_ROOT 'scripts/qualification/extract-windows-shell.ps1') -Archive "product/$env:PRODUCT_ARCHIVE" -Destination extracted -Native
          node scripts/qualification/verify-promotion.mjs product extracted $env:RELEASE_TAG $env:SOURCE_SHA promotion-identity.json
          if ($LASTEXITCODE -ne 0) { throw 'Promotion identity verification failed' }
          foreach ($subject in @("product/$env:PRODUCT_ARCHIVE", 'product/release-manifest.json')) {
            node scripts/qualification/release-identity.mjs attestation $subject $env:SOURCE_SHA --bundle product/qualification-provenance.json
            if ($LASTEXITCODE -ne 0) { throw "Qualified ZIP or source/version manifest provenance verification failed: $subject" }
          }
      - name: Verify distinct qualified Core original bytes and provenance
        shell: pwsh
        run: |
          $core = Get-Content product/core-release-manifest.json -Raw | ConvertFrom-Json
          $extract = Join-Path $env:RUNNER_TEMP 'promotion original Core'
          & (Join-Path $env:RESOURCE_PUBLISHER_ROOT 'scripts/qualification/extract-windows-shell.ps1') -Archive (Join-Path product $core.archive) -Destination $extract -Native
          $roots = @(Get-ChildItem -LiteralPath $extract -Directory)
          if ($roots.Count -ne 1) { throw 'Core extraction is ambiguous' }
          node scripts/qualification/verify-core-candidate.mjs product $roots[0].FullName $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Original Core identity verification failed' }
          $subjects = @($core.archive, 'core-release-manifest.json', 'core-distribution-manifest.json', ($core.archive -replace '\.zip$', '-Setup.exe')) | ForEach-Object { Join-Path product $_ }
          foreach ($subject in $subjects) {
            node scripts/qualification/release-identity.mjs attestation $subject $env:SOURCE_SHA --bundle product/qualification-provenance.json
            if ($LASTEXITCODE -ne 0) { throw "Original Core qualification provenance failed: $subject" }
          }

      - name: Verify qualified installer provenance
        shell: pwsh
        run: |
          $distributionPath = 'product/distribution-manifest.json'
          $subjects = @()
          if (Test-Path -LiteralPath $distributionPath) {
            $distribution = Get-Content $distributionPath -Raw | ConvertFrom-Json
            $subjects += @("product/$($distribution.archive)", $distributionPath)
          }
          $updatePath = 'product/update-manifest.json'
          if ($env:RELEASE_TAG -match '^v\d+\.\d+\.\d+$') {
            if (!(Test-Path -LiteralPath $updatePath)) { throw 'Stable update manifest is required' }
            node scripts/qualification/release-identity.mjs attestation $updatePath $env:SOURCE_SHA --bundle product/update-provenance.json
            if ($LASTEXITCODE -ne 0) { throw 'Original update verification bundle failed' }
            $bootstrap = "product/Mizar-v$($distribution.appVersion)-Windows-x64-WebInstaller.exe"
            node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/release-assets.mjs" assets product > public-assets.json
            if ($LASTEXITCODE -ne 0) { throw 'Native candidate identity failed' }
            $subjects += @($updatePath, $bootstrap, 'product/web-installer-build.json')
            node scripts/qualification/update-manifest.mjs product --check
            if ($LASTEXITCODE -ne 0) { throw 'Stable update contract validation failed' }
          }
          if ($subjects.Count -gt 0) {
            foreach ($subject in $subjects) {
              node scripts/qualification/release-identity.mjs attestation $subject $env:SOURCE_SHA --bundle product/qualification-provenance.json
              if ($LASTEXITCODE -ne 0) { throw "Original installer/update metadata provenance failed: $subject" }
            }
          }
      - name: Stage verified assets into an existing draft
        if: ${{ env.RELEASE_DRAFT_ID != '' }}
        shell: pwsh
        run: |
          if ($env:RELEASE_RECOVERY -ne 'true' -or $env:RELEASE_DRAFT_ID -notmatch '^\d+$' -or $env:RESOURCE_ENABLED -ne 'true') { throw 'Draft staging requires an explicit resource-aware recovery' }
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/release-assets.mjs" draft-stage product promotion-identity.json "$env:RESOURCE_FROZEN_ROOT" $env:RELEASE_DRAFT_ID
          if ($LASTEXITCODE -ne 0) { throw 'Draft staging failed; preserve existing assets for verification' }
      - name: Resolve release and tag existence without treating API failure as absence
        if: ${{ env.RELEASE_DRAFT_ID == '' }}
        shell: pwsh
        run: |
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/ci/resource-release.mjs" lookup-release product product/release-manifest.json existing-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Release/tag existence is unknown or conflicts; refusing mutation' }
      - name: Prepare prerelease original machine carrier
        if: ${{ env.RELEASE_DRAFT_ID == '' && contains(env.RELEASE_TAG, '-') && env.RESOURCE_ENABLED == 'true' }}
        shell: pwsh
        run: |
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/machine-metadata.mjs" product "$env:RESOURCE_FROZEN_ROOT" - product/machine-metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Prerelease original carrier failed' }

      - name: Bound Publish exact qualified assets to remaining time
        if: ${{ env.RELEASE_DRAFT_ID == '' }}
        id: budget_publish
        shell: pwsh
        run: |
          $created = gh api "repos/$env:GH_REPO/actions/runs/$env:RELEASE_BUDGET_RUN" --jq .created_at
          if ($LASTEXITCODE -ne 0 -or !$created) { throw 'Cannot read qualification start time' }
          $minutes = [math]::Floor((600 - ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($created)).TotalSeconds) / 60)
          if ($minutes -lt 1) { throw 'Less than one minute remains in release budget' }
          "minutes=$minutes" >> $env:GITHUB_OUTPUT
      - name: Publish exact qualified assets
        if: ${{ env.RELEASE_DRAFT_ID == '' }}
        timeout-minutes: ${{ fromJSON(steps.budget_publish.outputs.minutes) }}
        shell: pwsh
        run: |
          if ([DateTimeOffset]::UtcNow -gt [DateTimeOffset]::Parse($env:RELEASE_DEADLINE)) { throw 'Release 600-second budget exceeded' }
          $prereleaseFlags = @()
          if ($env:RELEASE_TAG -match '-(?:alpha|beta|rc)\.[1-9]\d*$') { $prereleaseFlags = @('--prerelease', '--latest=false') }
          $assets = @(node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/release-assets.mjs" assets product | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Consumer asset selection failed' }
          if ($env:RESOURCE_ENABLED -eq 'true') { $assets += @((Get-ChildItem -LiteralPath $env:RESOURCE_FROZEN_ROOT -Filter '*.zip' -File).FullName) }
          if ($env:RELEASE_FOUND -eq 'true') {
            gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" > existing-ref.json
            if ($LASTEXITCODE -ne 0) { throw 'Existing tag lookup failed' }
            $resources = if ($env:RESOURCE_ENABLED -eq 'true') { $env:RESOURCE_FROZEN_ROOT } else { '-' }
            node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/release-assets.mjs" reconcile product existing-release.json existing-ref.json promotion-identity.json $resources
            if ($LASTEXITCODE -ne 0) { throw 'Existing asset mismatch or missing-asset upload failed; no overwrite' }
            gh release edit $env:RELEASE_TAG --draft=false @prereleaseFlags
            if ($LASTEXITCODE -ne 0) { throw 'Draft completion failed' }
            gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" > existing-release.json
            if ($LASTEXITCODE -ne 0) { throw 'Existing release readback failed' }
            $existing = Get-Content existing-release.json -Raw | ConvertFrom-Json
            if (@($existing.assets | Where-Object { $_.name -in @('machine-metadata.json', 'update-index.json') }).Count) {
              $resourceArgument = if ($env:RESOURCE_ENABLED -eq 'true') { $env:RESOURCE_FROZEN_ROOT } else { '-' }
              node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/update-publication.mjs" verify-existing existing-release.json existing-ref.json $env:RELEASE_TAG product "$resourceArgument"
              if ($LASTEXITCODE -ne 0) { throw 'Existing authorization invalid; refusing replacement' }
              'RELEASE_ALREADY_PUBLISHED=true' >> $env:GITHUB_ENV
            }
          } else {
            $identity = Get-Content promotion-identity.json -Raw | ConvertFrom-Json
            node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/release-notes.mjs" $identity.appVersion $env:SOURCE_SHA $env:RUN_ID release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed' }
            $args = @('release','create',$env:RELEASE_TAG,'--target',$env:SOURCE_SHA,'--draft','--title',"Mizar $env:RELEASE_TAG",'--notes-file','release-notes.md') + $assets
            $args += $prereleaseFlags
            gh @args
            if ($LASTEXITCODE -ne 0) { throw 'Draft upload incomplete; retry verifies original bytes and adds missing assets' }
            gh release edit $env:RELEASE_TAG --draft=false @prereleaseFlags
            if ($LASTEXITCODE -ne 0) { throw 'Publication failed; retry retains original assets' }
          }
      - name: Verify actual public resource assets before downstream authorization
        if: ${{ env.RELEASE_DRAFT_ID == '' && env.RESOURCE_ENABLED == 'true' }}
        shell: pwsh
        run: |
          gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" > resource-published-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Published resource readback failed' }
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/ci/resource-release.mjs" published-release "$env:RESOURCE_FROZEN_ROOT" product/core-release-manifest.json resource-published-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Public resources differ from the signed immutable candidate' }
      - name: Confirm the published Stable and prepare its authorization
        if: ${{ env.RELEASE_DRAFT_ID == '' && !contains(env.RELEASE_TAG, '-') && env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        shell: pwsh
        run: |
          if ([DateTimeOffset]::UtcNow -gt [DateTimeOffset]::Parse($env:RELEASE_DEADLINE)) { throw 'Release 600-second budget exceeded' }
          gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" > published-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Published release lookup failed' }
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" > published-ref.json
          if ($LASTEXITCODE -ne 0) { throw 'Published tag lookup failed' }
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/update-publication.mjs" create published-release.json published-ref.json $env:RELEASE_TAG product update-publication.json
          if ($LASTEXITCODE -ne 0) { throw 'Published Stable authorization preparation failed' }
      - name: Attest the actual Stable publication
        if: ${{ env.RELEASE_DRAFT_ID == '' && !contains(env.RELEASE_TAG, '-') && env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        id: publication-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: update-publication.json
      - name: Bound Upload and verify publication authorization to remaining time
        id: budget_authorize
        if: ${{ env.RELEASE_DRAFT_ID == '' && !contains(env.RELEASE_TAG, '-') && env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        shell: pwsh
        run: |
          $created = gh api "repos/$env:GH_REPO/actions/runs/$env:RELEASE_BUDGET_RUN" --jq .created_at
          if ($LASTEXITCODE -ne 0 -or !$created) { throw 'Cannot read qualification start time' }
          $minutes = [math]::Floor((600 - ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($created)).TotalSeconds) / 60)
          if ($minutes -lt 1) { throw 'Less than one minute remains in release budget' }
          "minutes=$minutes" >> $env:GITHUB_OUTPUT
      - name: Upload and verify publication authorization
        timeout-minutes: ${{ fromJSON(steps.budget_authorize.outputs.minutes) }}
        if: ${{ env.RELEASE_DRAFT_ID == '' && !contains(env.RELEASE_TAG, '-') && env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        shell: pwsh
        env:
          PUBLICATION_BUNDLE: ${{ steps.publication-provenance.outputs.bundle-path }}
        run: |
          if ([DateTimeOffset]::UtcNow -gt [DateTimeOffset]::Parse($env:RELEASE_DEADLINE)) { throw 'Release 600-second budget exceeded' }
          Copy-Item -LiteralPath $env:PUBLICATION_BUNDLE -Destination update-publication-provenance.json
          gh attestation verify update-publication.json --repo $env:GH_REPO --signer-workflow "$env:GH_REPO/.github/workflows/release-promotion.yml@refs/heads/main" --source-ref refs/heads/main --source-digest $env:GITHUB_SHA --bundle update-publication-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Publication authorization verification failed' }
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/update-index.mjs" product/update-manifest.json product/update-provenance.json update-publication.json update-publication-provenance.json update-index.json
          if ($LASTEXITCODE -ne 0) { throw 'Original dual-signature envelope preparation failed' }
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/machine-metadata.mjs" product "$env:RESOURCE_FROZEN_ROOT" update-index.json machine-metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Original machine metadata aggregation failed' }
          gh release upload $env:RELEASE_TAG machine-metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Publication authorization upload failed; do not overwrite assets' }
          gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" > published-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Publication authorization readback failed' }
          $resourceArgument = if ($env:RESOURCE_ENABLED -eq 'true') { $env:RESOURCE_FROZEN_ROOT } else { '-' }
          node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/update-publication.mjs" verify-existing published-release.json published-ref.json $env:RELEASE_TAG product "$resourceArgument"
          if ($LASTEXITCODE -ne 0) { throw 'Published asset readback verification failed' }

      - name: Record qualification trigger through verified publication timing
        if: ${{ env.RELEASE_DRAFT_ID == '' && !contains(env.RELEASE_TAG, '-') }}
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath 'evidence-extracted/build-timings.json' -PathType Leaf)) { throw 'Qualified evidence is missing build timing' }
          if (!$env:QUALIFICATION_ATTEMPT -or $env:RUN_ID -ne $env:GITHUB_RUN_ID) { node "$env:RESOURCE_PUBLISHER_ROOT/scripts/qualification/release-timings.mjs" promotion release-timings.json }
          if ($LASTEXITCODE -ne 0) { throw 'Release timing identity/path validation failed' }
      - name: Preserve maintainer promotion records in CI only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-records-${{ github.run_attempt }}
          path: |
            promotion-identity.json
            promotion-ci.json
            release-timings.json
            update-publication.json
            update-publication-provenance.json
            update-index.json
          if-no-files-found: warn
