name: Release Promotion
run-name: Release Promotion
on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful Release Qualification run ID
        required: true
        type: string
      tag:
        description: Exact application version tag (v1.1.0-rc.N or v1.1.0)
        required: true
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
concurrency:
  group: release-promotion-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    name: 发布 Mizar ${{ inputs.tag }}
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.qualification_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Require main promotion workflow
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Promotion must run from main' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve successful qualification source
        shell: pwsh
        run: |
          if ($env:RUN_ID -notmatch '^\d+$') { throw 'Invalid run ID' }
          $run = gh api "repos/$env:GH_REPO/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/release-qualification.yml' -or $run.event -ne 'workflow_dispatch' -or $run.head_branch -ne 'main') { throw 'Not a successful main qualification run' }
          $run | ConvertTo-Json -Depth 50 | Set-Content qualification-run.json -Encoding utf8
          gh run download $env:RUN_ID --name release-portable-product --dir product
          if ($LASTEXITCODE -ne 0) { throw 'Product download failed' }
          gh run download $env:RUN_ID --name release-qualification-evidence --dir evidence
          if ($LASTEXITCODE -ne 0) { throw 'Evidence download failed' }
          $manifest = Get-Content product/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.gitSha -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source SHA' }
          node scripts/qualification/release-identity.mjs promotion qualification-run.json product/release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Qualified product and main signing source differ' }
          # The product, workflow run and all evidence name the same exact source.
          New-Item -ItemType Directory -Path evidence-extracted | Out-Null
          $ev = Get-ChildItem evidence -Filter '*.zip'
          if (@($ev).Count -ne 1) { throw 'Ambiguous evidence' }
          Expand-Archive -LiteralPath $ev.FullName -DestinationPath evidence-extracted
          $evManifest = Get-Content evidence-extracted/release-manifest.json -Raw | ConvertFrom-Json
          foreach ($field in @('gitSha','archiveSha256','contentDigest','appVersion')) { if ($manifest.$field -ne $evManifest.$field) { throw "Evidence mismatch: $field" } }
          "SOURCE_SHA=$($manifest.gitSha)" >> $env:GITHUB_ENV
          "PRODUCT_ARCHIVE=$($manifest.archive)" >> $env:GITHUB_ENV
      - name: Require full CI for the product manifest source
        shell: pwsh
        run: |
          node scripts/qualification/verify-source-ci.mjs product/release-manifest.json promotion-ci.json
          if ($LASTEXITCODE -ne 0) { throw 'Full source CI verification failed' }
      - name: Checkout the qualified source (no rebuild)
        shell: pwsh
        run: |
          git fetch --depth 1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source fetch failed' }
          git checkout --detach $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
      - name: Verify original ZIP, payload, compiled version and tag
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path extracted | Out-Null
          Expand-Archive -LiteralPath "product/$env:PRODUCT_ARCHIVE" -DestinationPath extracted
          node scripts/qualification/verify-promotion.mjs product extracted $env:RELEASE_TAG $env:SOURCE_SHA promotion-identity.json
          if ($LASTEXITCODE -ne 0) { throw 'Promotion identity verification failed' }
          node scripts/qualification/release-identity.mjs attestation "product/$env:PRODUCT_ARCHIVE" $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Qualified ZIP provenance verification failed' }
          node scripts/qualification/release-identity.mjs attestation product/release-manifest.json $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Qualified source/version manifest provenance verification failed' }
      - name: Verify qualified installer provenance
        shell: pwsh
        run: |
          $distributionPath = 'product/distribution-manifest.json'
          if (Test-Path -LiteralPath $distributionPath) {
            $distribution = Get-Content $distributionPath -Raw | ConvertFrom-Json
            node scripts/qualification/release-identity.mjs attestation "product/$($distribution.archive)" $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Setup provenance verification failed' }
            node scripts/qualification/release-identity.mjs attestation $distributionPath $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Setup manifest provenance verification failed' }
          }
          $updatePath = 'product/update-manifest.json'
          if ($env:RELEASE_TAG -match '^v\d+\.\d+\.\d+$') {
            if (!(Test-Path -LiteralPath $updatePath)) { throw 'Stable update manifest is required' }
            node scripts/qualification/release-identity.mjs attestation $updatePath $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Stable update provenance verification failed' }
            node scripts/qualification/release-identity.mjs attestation $updatePath $env:SOURCE_SHA --bundle product/update-provenance.json
            if ($LASTEXITCODE -ne 0) { throw 'Original update verification bundle failed' }
            node scripts/qualification/update-manifest.mjs product --check
            if ($LASTEXITCODE -ne 0) { throw 'Stable update contract validation failed' }
          }
      - name: Publish exact qualified assets
        shell: pwsh
        run: |
          $existing = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            $ref = gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Existing release tag could not be verified' }
            $existing | ConvertTo-Json -Depth 50 | Set-Content existing-release.json -Encoding utf8
            $ref | ConvertTo-Json -Depth 50 | Set-Content existing-ref.json -Encoding utf8
            node scripts/qualification/update-publication.mjs verify-existing existing-release.json existing-ref.json $env:RELEASE_TAG product evidence
            if ($LASTEXITCODE -ne 0) { throw 'Existing release is incomplete or differs; refusing overwrite' }
            'RELEASE_ALREADY_PUBLISHED=true' >> $env:GITHUB_ENV
            exit 0
          }
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Existing tag without verified release; refusing mutation' }
          $assets = @((Get-ChildItem product -File).FullName) + @((Get-ChildItem evidence -Filter '*.zip').FullName) + @((Resolve-Path promotion-identity.json).Path) + @((Resolve-Path promotion-ci.json).Path)
          $identity = Get-Content promotion-identity.json -Raw | ConvertFrom-Json
          node scripts/qualification/release-notes.mjs $identity.appVersion $env:SOURCE_SHA $env:RUN_ID release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed' }
          $args = @('release','create',$env:RELEASE_TAG,'--target',$env:SOURCE_SHA,'--draft','--title',"Mizar $env:RELEASE_TAG",'--notes-file','release-notes.md') + $assets
          if ($env:RELEASE_TAG -match '-rc\.') { $args += '--prerelease' }
          gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; inspect before retry' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; no rebuild or overwrite attempted' }
      - name: Confirm the published Stable and prepare its authorization
        if: ${{ !contains(inputs.tag, '-') && env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        shell: pwsh
        run: |
          gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" > published-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Published release lookup failed' }
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" > published-ref.json
          if ($LASTEXITCODE -ne 0) { throw 'Published tag lookup failed' }
          node scripts/qualification/update-publication.mjs create published-release.json published-ref.json $env:RELEASE_TAG product evidence update-publication.json
          if ($LASTEXITCODE -ne 0) { throw 'Published Stable authorization preparation failed' }
      - name: Attest the actual Stable publication
        if: ${{ !contains(inputs.tag, '-') && env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        id: publication-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: update-publication.json
      - name: Upload and verify publication authorization
        if: ${{ !contains(inputs.tag, '-') && env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        shell: pwsh
        env:
          PUBLICATION_BUNDLE: ${{ steps.publication-provenance.outputs.bundle-path }}
        run: |
          Copy-Item -LiteralPath $env:PUBLICATION_BUNDLE -Destination update-publication-provenance.json
          gh attestation verify update-publication.json --repo $env:GH_REPO --signer-workflow "$env:GH_REPO/.github/workflows/release-promotion.yml@refs/heads/main" --source-ref refs/heads/main --source-digest $env:GITHUB_SHA --bundle update-publication-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Publication authorization verification failed' }
          gh release upload $env:RELEASE_TAG update-publication.json update-publication-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Publication authorization upload failed; do not overwrite assets' }
          gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" > published-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Publication authorization readback failed' }
          node scripts/qualification/update-publication.mjs verify-existing published-release.json published-ref.json $env:RELEASE_TAG product evidence
          if ($LASTEXITCODE -ne 0) { throw 'Published asset readback verification failed' }
