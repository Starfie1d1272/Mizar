# Keep the existing required status until branch protection is updated.
# PR title wording is not a merge requirement.
name: PR metadata

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve required status compatibility
        run: echo "PR title format is not required."
