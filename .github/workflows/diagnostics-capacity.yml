name: Diagnostic Capacity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics-capacity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24 and pnpm 12
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: false
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure diagnostic capacity with local R2 and D1
        run: |
          mkdir -p .agent-tmp
          pnpm diagnostics:capacity .agent-tmp/diagnostics-capacity.json

      - name: Upload capacity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-capacity-${{ github.sha }}-${{ github.run_attempt }}
          path: .agent-tmp/diagnostics-capacity.json
          if-no-files-found: error
          retention-days: 7
