name: Publish Radar package

on:
  push:
    tags: ['radar-view-v*']

concurrency:
  group: publish-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Starfie1d1272/Mizar'
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 12.3.4
          runtime: node@24
          install: false
      - name: Verify release tag and successful exact-revision CI
        id: release
        run: node scripts/radar-view/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm install --global npm@12.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mizar/radar-view... build
      - run: node --test scripts/radar-view/release.test.mjs
      - name: Install and verify the exact tarball to publish
        run: node scripts/radar-view/consumer-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-view-release-${{ github.ref_name }}
          path: .agent-tmp/radar-package/
          if-no-files-found: error
      - name: Publish verified tarball with npm trusted publishing
        working-directory: .agent-tmp/radar-package
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          sha256sum --check SHA256SUMS
          npm publish ./*.tgz --ignore-scripts --access public --tag "$DIST_TAG" --provenance
