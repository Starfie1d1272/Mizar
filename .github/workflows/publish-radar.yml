name: Publish Radar package

on:
  push:
    tags: ['radar-view-v*']

concurrency:
  group: publish-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Starfie1d1272/Mizar'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      dist-tag: ${{ steps.release.outputs.dist_tag }}
      digest: ${{ steps.identity.outputs.digest }}
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - name: Verify release tag and successful exact-revision CI
        id: release
        run: node scripts/radar-view/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mizar-hud/radar-view... --fail-if-no-match run build
      - name: Install and verify the exact tarball to publish
        run: node scripts/radar-view/consumer-smoke.mjs
      - name: Record verified tarball identity
        id: identity
        working-directory: .agent-tmp/radar-package
        run: |
          sha256sum --check SHA256SUMS
          read -r digest _ < SHA256SUMS
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "revision=$(cat revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-view-release-${{ github.ref_name }}
          path: .agent-tmp/radar-package/
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download the artifact from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: radar-view-release-${{ github.ref_name }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir verified --repo "$GITHUB_REPOSITORY"
      - run: npm install --global --ignore-scripts npm@12.2.0
      - name: Publish verified tarball with npm trusted publishing
        working-directory: verified
        env:
          DIST_TAG: ${{ needs.prepare.outputs.dist-tag }}
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.digest }}
          EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          read -r digest tarball < SHA256SUMS
          test "$digest" = "$EXPECTED_DIGEST"
          test "$(cat revision.txt)" = "$EXPECTED_REVISION"
          sha256sum --check SHA256SUMS
          npm publish "./$tarball" --ignore-scripts --access public --tag "$DIST_TAG" --provenance
