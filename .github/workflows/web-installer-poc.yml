name: Web Installer POC
on:
  pull_request:
    paths:
      - 'scripts/web-installer/**'
      - 'packages/resource-pack-contract/**'
      - 'apps/companion/src/resource-store/**'
      - 'scripts/qualification/installer-assets/**'
      - '.github/workflows/web-installer-poc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true
          install: false
      - name: Build real shared runtime and Companion bridge dependencies
        shell: powershell
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Dependency installation failed' }
          pnpm --filter @mizar/companion... --fail-if-no-match run build
          if ($LASTEXITCODE) { throw 'Companion build failed' }
          pnpm --filter @mizar/companion deploy --prod .agent-tmp/web-installer/bridge/resources/app
          if ($LASTEXITCODE) { throw 'Actual production dependency deployment failed' }
          node scripts/web-installer/prepare-bridge.mjs .agent-tmp/web-installer/bridge
          if ($LASTEXITCODE) { throw 'Bridge deployment failed' }
      - name: Verify real Windows Store FS and offline catalog SDK rejection
        shell: powershell
        run: |
          pnpm exec vitest run packages/resource-pack-contract/catalog.test.mjs apps/companion/test/resource-store/store.test.ts apps/companion/test/resource-store/app-integration.test.ts
          if ($LASTEXITCODE) { throw 'Windows resource integration tests failed' }
          node scripts/web-installer/test-pack-cache-boundary.mjs .agent-tmp/web-installer/bridge/resources/app/dist/web-installer/install-official-pack.mjs
          if ($LASTEXITCODE) { throw 'Unverified policy rejection failed' }
      - name: Compile and test the native bootstrapper
        shell: powershell
        run: ./scripts/web-installer/test-poc.ps1 -OutputDirectory .agent-tmp/web-installer
      - name: Verify existing authenticated NSIS with fresh installation and cancellation
        shell: powershell
        run: |
          $env:MIZAR_BRIDGE_NODE = (Get-Command node).Source
          $env:MIZAR_BRIDGE_SCRIPT = [IO.Path]::GetFullPath('scripts/web-installer/test-bootstrap-boundary.mjs')
          $env:MIZAR_BRIDGE_MODULE = [IO.Path]::GetFullPath('.agent-tmp/web-installer/bridge/resources/app/dist/web-installer/complete-bootstrap.mjs')
          $env:MIZAR_BRIDGE_PLAN = [IO.Path]::GetFullPath('scripts/web-installer/legacy-stable-plan.json')
          ./scripts/web-installer/test-nsis.ps1 -OutputDirectory .agent-tmp/web-installer
      - name: Verify public HTTPS download and capture actual native UI
        shell: powershell
        run: ./scripts/web-installer/capture-poc.ps1 -OutputDirectory .agent-tmp/web-installer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-installer-poc-native
          path: |
            .agent-tmp/web-installer/*.exe
            .agent-tmp/web-installer/*.json
            .agent-tmp/web-installer/*.png
