name: Quick Desktop Fix
run-name: Quick desktop fix from ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 已发布的稳定版资源标签（仅适用于桌面代码改动）
        required: true
        default: v1.10.2
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_TAG: ${{ inputs.base_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - uses: ./.github/actions/cargo-cache
        with:
          profile: ci
      - name: Resolve original stable resources and build desktop host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Base tag must be an exact stable version' }
          $baseVersion = $env:BASE_TAG.Substring(1)
          $baseSha = (git rev-parse "$env:BASE_TAG^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $baseSha -notmatch '^[a-f0-9]{40}$') { throw 'Base tag unavailable' }
          $changed = @(git diff --name-only $baseSha $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0 -or @($changed | Where-Object { $_ -notmatch '^apps/desktop/src-tauri/' -and $_ -notmatch '^\.github/workflows/' -and $_ -ne 'scripts/qualification/temporary-workbench-bundle.mjs' }).Count) { throw 'Quick desktop build supports desktop-only changes' }
          $dir = Join-Path $env:RUNNER_TEMP 'quick-desktop'
          New-Item -ItemType Directory -Path $dir | Out-Null
          gh release download $env:BASE_TAG --repo Starfie1d1272/Mizar --pattern 'machine-metadata.json' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Published metadata unavailable' }
          $carrier = Get-Content -Raw -LiteralPath (Join-Path $dir 'machine-metadata.json') | ConvertFrom-Json
          $files = @($carrier.files | Where-Object { $_.name -eq 'release-manifest.json' })
          if ($files.Count -ne 1) { throw 'Original manifest is ambiguous' }
          $manifest = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($files[0].bytesBase64)) | ConvertFrom-Json
          $archiveName = "Mizar-$env:BASE_TAG-Windows-x64.zip"
          if ($manifest.gitSha -ne $baseSha -or $manifest.appVersion -ne $baseVersion -or $manifest.archive -ne $archiveName -or $manifest.archiveSha256 -notmatch '^[a-f0-9]{64}$') { throw 'Published baseline identity differs' }
          gh release download $env:BASE_TAG --repo Starfie1d1272/Mizar --pattern $archiveName --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Published portable bundle unavailable' }
          $zip = Join-Path $dir $archiveName
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant() -ne $manifest.archiveSha256) { throw 'Published bundle bytes differ' }
          cargo build --locked --profile ci --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'extracted')
          $bundle = Join-Path $dir "extracted/Mizar-$env:BASE_TAG-Windows-x64"
          $exe = 'apps/desktop/src-tauri/target/ci/mizar-desktop.exe'
          node scripts/qualification/temporary-workbench-bundle.mjs $bundle $exe $env:GITHUB_SHA $baseVersion $baseSha
          if ($LASTEXITCODE -ne 0) { throw 'Temporary product preparation failed' }
          "QUICK_BUNDLE=$bundle" >> $env:GITHUB_ENV
          "QUICK_VERSION=$baseVersion" >> $env:GITHUB_ENV
          "QUICK_BASE_SHA=$baseSha" >> $env:GITHUB_ENV
      - name: Build complete temporary installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if ((& $compiler /VERSION | Out-String).Trim() -ne 'v3.11') { throw 'Unexpected NSIS version' }
          function Escape-Nsis([string]$text) { $text.Replace('$', '$$').Replace('"', '$\"') }
          $remove = Join-Path $env:RUNNER_TEMP 'quick-remove.nsh'
          $files = @(Get-ChildItem -LiteralPath $env:QUICK_BUNDLE -Recurse -File)
          $lines = @($files | ForEach-Object { 'Delete "$INSTDIR\' + (Escape-Nsis ([IO.Path]::GetRelativePath($env:QUICK_BUNDLE, $_.FullName))) + '"' })
          $lines += @(Get-ChildItem -LiteralPath $env:QUICK_BUNDLE -Recurse -Directory | Sort-Object { $_.FullName.Length } -Descending | ForEach-Object { 'RMDir "$INSTDIR\' + (Escape-Nsis ([IO.Path]::GetRelativePath($env:QUICK_BUNDLE, $_.FullName))) + '"' })
          $lines | Set-Content -LiteralPath $remove -Encoding utf8
          $output = Join-Path $env:RUNNER_TEMP 'quick-output'
          New-Item -ItemType Directory -Path $output | Out-Null
          $installer = Join-Path $output "Mizar-$env:QUICK_VERSION-desktop-temporary-Setup.exe"
          $icon = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/icons/icon.ico'
          $assets = Join-Path $env:GITHUB_WORKSPACE 'scripts/qualification/installer-assets'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/qualification/windows-setup.nsi'
          & $compiler /INPUTCHARSET UTF8 "/DPAYLOAD=$env:QUICK_BUNDLE" "/DOUTPUT=$installer" "/DVERSION=$env:QUICK_VERSION" "/DICON=$icon" "/DINSTALLER_ASSETS=$assets" "/DREMOVE_FILES=$remove" $script
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $installer)) { throw 'Temporary installer compilation failed' }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "SHA256=$digest`nSOURCE_SHA=$env:GITHUB_SHA`nBASE_TAG=$env:BASE_TAG`nBASE_SHA=$env:QUICK_BASE_SHA`nPROFILE=ci`nUNSIGNED_TEMPORARY_BUILD=true" | Set-Content -Encoding utf8 (Join-Path $output 'identity.txt')
      - name: Provide temporary installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mizar-quick-desktop-setup-${{ github.run_id }}
          path: ${{ runner.temp }}/quick-output/*
          if-no-files-found: error
          retention-days: 7
