name: Box Sync
on:
  workflow_run:
    workflows: [Release Promotion]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 正式版本标签（同步时必填，例如 v1.0.0）
        type: string
      mode:
        description: 同步拆分分发或只读验收用户入口
        type: choice
        default: sync
        options: [sync, probe, verify-downloads]
      transport:
        description: 上传传输（默认 curl）
        type: choice
        default: curl
        options: [curl, native]
permissions:
  contents: read
  actions: read
concurrency:
  group: mizar-box-stable
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Starfie1d1272/Mizar' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.path == '.github/workflows/release-promotion.yml' && contains(fromJSON('["workflow_dispatch","workflow_run"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # Manual sync is recovery of an existing release, outside the initial 600-second budget.
      - name: Check remaining release budget
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN: ${{ github.event.workflow_run.id }}
          PROMOTION_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN/jobs?per_page=100" --jq '.jobs[] | select(.name | test("^发布 Mizar v[0-9]+\\.[0-9]+\\.[0-9]+-(alpha|beta|rc)\\.[1-9][0-9]*$")) | .name')
          if [ -n "$job" ]; then exit 0; fi
          gh run download "$PROMOTION_RUN" --name "promotion-records-$PROMOTION_ATTEMPT" --dir "$RUNNER_TEMP/release-records"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/release-records/release-timings.json")); const t=Date.parse(r.qualification.createdAt); const seconds=Math.floor((t+600000-Date.now())/1000); if (!Number.isFinite(t) || seconds<1) throw new Error("Release 600-second budget exceeded or missing start time"); console.log(`RELEASE_DEADLINE_EPOCH=${Math.floor((t+600000)/1000)}`);' >> "$GITHUB_ENV"
      - name: 同步与校验云盘
        id: mirror
        env:
          # 跨境往返可能超过 Node 默认的 250 毫秒地址选择等待时间。
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
          GH_TOKEN: ${{ github.token }}
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          BOX_UPLOAD_TRANSPORT: ${{ inputs.transport || 'curl' }}
          BOX_SYNC_MODE: ${{ inputs.mode || 'sync' }}
        run: |
          if [ -n "$RELEASE_DEADLINE_EPOCH" ]; then
            remaining=$(( RELEASE_DEADLINE_EPOCH - $(date -u +%s) ))
            test "$remaining" -gt 0
            timeout --signal=KILL "${remaining}s" node scripts/qualification/box-sync.mjs
          else
            node scripts/qualification/box-sync.mjs
          fi
      - name: Record complete qualification trigger through Box verification timing
        if: steps.mirror.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualification/release-timings.mjs box release-timings.json
      - if: always() && steps.mirror.outputs.prerelease == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-timings.json
          retention-days: 7
