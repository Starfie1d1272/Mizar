name: Box Sync
on:
  workflow_run:
    workflows: [Release Promotion]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 正式版本标签（同步时必填，例如 v1.0.0）
        type: string
      mode:
        description: 同步拆分分发或只读验收用户入口
        type: choice
        default: sync
        options: [sync, probe, verify-downloads]
      transport:
        description: 上传传输（默认 curl）
        type: choice
        default: curl
        options: [curl, native]
permissions:
  contents: read
  actions: read
concurrency:
  group: mizar-box-stable
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Starfie1d1272/Mizar' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.path == '.github/workflows/release-promotion.yml' && github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: 同步与校验云盘
        id: mirror
        env:
          # 跨境往返可能超过 Node 默认的 250 毫秒地址选择等待时间。
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
          GH_TOKEN: ${{ github.token }}
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          BOX_UPLOAD_TRANSPORT: ${{ inputs.transport || 'curl' }}
          BOX_SYNC_MODE: ${{ inputs.mode || 'sync' }}
        run: node scripts/qualification/box-sync.mjs
      - name: Record complete qualification trigger through Box verification timing
        if: steps.mirror.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualification/release-timings.mjs box release-timings.json
      - if: always() && steps.mirror.outputs.prerelease == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-timings.json
          retention-days: 7
