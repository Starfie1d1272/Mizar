name: Box Sync
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
      mode:
        type: choice
        options: [sync, probe, verify-downloads]
      transport:
        type: choice
        options: [curl, native]
permissions:
  contents: read
  actions: read
concurrency:
  group: mizar-box-stable
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'Starfie1d1272/Mizar'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download official 1.9.1 original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.9.1 --repo Starfie1d1272/Mizar --pattern 'Mizar-v1.9.1-Windows-x64-WebInstaller.exe' --pattern machine-metadata.json --dir "$RUNNER_TEMP/original-191"
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const m=JSON.parse(readFileSync(process.argv[1])); const p=m.files.filter(f=>f.name==='qualification-provenance.json'); if(p.length!==1) throw Error('Qualification proof missing or ambiguous'); writeFileSync(process.argv[2],Buffer.from(p[0].bytesBase64,'base64'));" "$RUNNER_TEMP/original-191/machine-metadata.json" "$RUNNER_TEMP/original-191/qualification-provenance.json"
      - name: Verify original qualification signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$RUNNER_TEMP/original-191/Mizar-v1.9.1-Windows-x64-WebInstaller.exe" --repo Starfie1d1272/Mizar --signer-workflow 'Starfie1d1272/Mizar/.github/workflows/release-qualification.yml@refs/heads/main' --source-ref refs/heads/main --source-digest b0da60a45d93294043bbb24e34cdd4b70bcbc9e8 --bundle "$RUNNER_TEMP/original-191/qualification-provenance.json"
      - name: Restore and verify original 1.9.1 download
        env:
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
        run: node scripts/qualification/inspect-192-runtime.mjs "$RUNNER_TEMP/original-191/Mizar-v1.9.1-Windows-x64-WebInstaller.exe"
