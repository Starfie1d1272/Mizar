name: Box Sync
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
      mode:
        type: choice
        options: [sync, probe, verify-downloads]
      transport:
        type: choice
        options: [curl, native]
permissions:
  contents: read
concurrency:
  group: mizar-box-stable
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'Starfie1d1272/Mizar'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read only 1.9.2 Runtime and staging state
        env:
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
        run: node scripts/qualification/inspect-192-runtime.mjs
