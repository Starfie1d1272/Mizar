name: Box Sync
on:
  workflow_run:
    workflows: [Release Promotion]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 正式版本标签（同步时必填，例如 v1.0.0）
        type: string
      mode:
        description: 同步拆分分发或只读验收用户入口
        type: choice
        default: sync
        options: [sync, probe, verify-downloads]
      transport:
        description: 上传传输（默认 curl）
        type: choice
        default: curl
        options: [curl, native]
permissions:
  contents: read
  actions: read
concurrency:
  group: mizar-box-stable
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Starfie1d1272/Mizar' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.display_title, 'Stage draft ') && github.event.workflow_run.path == '.github/workflows/release-promotion.yml' && contains(fromJSON('["workflow_dispatch","workflow_run"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
      BOX_UPLOAD_TRANSPORT: ${{ inputs.transport || 'curl' }}
      BOX_SYNC_MODE: ${{ inputs.mode || 'sync' }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: 固定本次阶段工具源码
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 探测或只读核验入口
        if: ${{ env.BOX_SYNC_MODE != 'sync' }}
        id: special
        env:
          GH_TOKEN: ${{ github.token }}
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
        run: node scripts/qualification/box-sync.mjs
      - name: 读取并核对 Release 与标签
        if: ${{ env.BOX_SYNC_MODE == 'sync' }}
        id: read_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualification/box-phases.mjs read-release "$RUNNER_TEMP/box-release.json"
      - name: 下载并验证签名元数据
        if: ${{ steps.read_release.outputs.sync == 'true' }}
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualification/box-phases.mjs prepare "$RUNNER_TEMP/box-plan" "$RUNNER_TEMP/box-release.json"
      - name: 并行完成三个独立分发通道
        if: ${{ steps.plan.outcome == 'success' }}
        id: lanes
        env:
          GH_TOKEN: ${{ github.token }}
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
          BOX_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: node scripts/qualification/box-lanes.mjs run "$RUNNER_TEMP/box-plan" "$RUNNER_TEMP/box-lanes" "$RUNNER_TEMP/box-receipts"
      - name: 复核全部回执、匿名入口和远端原字节
        if: ${{ steps.lanes.outcome == 'success' }}
        id: final_check
        env:
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
          BOX_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: node scripts/qualification/box-phases.mjs final-check "$RUNNER_TEMP/box-plan" "$RUNNER_TEMP/box-receipts"
      - name: 发布更新索引
        if: ${{ steps.final_check.outcome == 'success' }}
        id: index_update
        env:
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
          BOX_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: node scripts/qualification/box-phases.mjs index-update "$RUNNER_TEMP/box-plan" "$RUNNER_TEMP/box-receipts"
      - name: 完整回读更新索引
        if: ${{ steps.index_update.outcome == 'success' }}
        id: index_verify
        env:
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
          BOX_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: node scripts/qualification/box-phases.mjs index-verify "$RUNNER_TEMP/box-plan" "$RUNNER_TEMP/box-receipts"
      - name: 匿名完整下载用户入口
        if: ${{ steps.index_verify.outcome == 'success' }}
        id: anonymous
        env:
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
          BOX_PLAN_SHA256: ${{ steps.plan.outputs.plan_sha256 }}
        run: node scripts/qualification/box-phases.mjs anonymous "$RUNNER_TEMP/box-plan" "$RUNNER_TEMP/box-receipts"
      - name: Record complete qualification trigger through Box verification timing
        if: ${{ always() && env.BOX_SYNC_MODE == 'sync' && (steps.read_release.outputs.prerelease == 'false' || steps.read_release.outcome != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOX_OUTCOME: ${{ steps.plan.outcome == 'success' && steps.lanes.outcome == 'success' && steps.final_check.outcome == 'success' && steps.index_update.outcome == 'success' && steps.index_verify.outcome == 'success' && steps.anonymous.outcome == 'success' && 'success' || 'failure' }}
          READ_RECOVERY: ${{ steps.read_release.outputs.recovery_started_at }}
          PLAN_RECOVERY: ${{ steps.plan.outputs.recovery_started_at }}
          LANES_RECOVERY: ${{ steps.lanes.outputs.recovery_started_at }}
          FINAL_RECOVERY: ${{ steps.final_check.outputs.recovery_started_at }}
          INDEX_RECOVERY: ${{ steps.index_update.outputs.recovery_started_at }}
          VERIFY_RECOVERY: ${{ steps.index_verify.outputs.recovery_started_at }}
          ANONYMOUS_RECOVERY: ${{ steps.anonymous.outputs.recovery_started_at }}
        run: |
          BOX_RECOVERY_STARTED_AT=""
          for value in "$READ_RECOVERY" "$PLAN_RECOVERY" "$LANES_RECOVERY" "$FINAL_RECOVERY" "$INDEX_RECOVERY" "$VERIFY_RECOVERY" "$ANONYMOUS_RECOVERY"; do
            if [[ -n "$value" && ( -z "$BOX_RECOVERY_STARTED_AT" || "$value" < "$BOX_RECOVERY_STARTED_AT" ) ]]; then BOX_RECOVERY_STARTED_AT="$value"; fi
          done
          export BOX_RECOVERY_STARTED_AT
          node scripts/qualification/release-timings.mjs box release-timings.json
      - if: ${{ always() && env.BOX_SYNC_MODE == 'sync' && (steps.read_release.outputs.prerelease == 'false' || steps.read_release.outcome != 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-timings.json
          retention-days: 7
