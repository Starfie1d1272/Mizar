name: Box Sync
on:
  workflow_run:
    workflows: [Release Promotion]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 正式版本标签（例如 v1.0.0）
        required: true
        type: string
      transport:
        description: 上传传输（默认 curl）
        type: choice
        default: curl
        options: [curl, native]
permissions:
  contents: read
  actions: read
concurrency:
  group: mizar-box-stable
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Starfie1d1272/Mizar' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.display_title, 'Stage draft ') && github.event.workflow_run.path == '.github/workflows/release-promotion.yml' && contains(fromJSON('["workflow_dispatch","workflow_run"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
      BOX_UPLOAD_TRANSPORT: ${{ inputs.transport || 'curl' }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: 同步兼容元数据与更新索引
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
        run: node scripts/qualification/box-sync.mjs
      - name: Record complete qualification trigger through Box verification timing
        if: ${{ always() && (steps.sync.outputs.prerelease == 'false' || steps.sync.outcome != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOX_OUTCOME: ${{ steps.sync.outcome == 'success' && 'success' || 'failure' }}
          BOX_RECOVERY_STARTED_AT: ${{ steps.sync.outputs.recovery_started_at }}
        run: node scripts/qualification/release-timings.mjs box release-timings.json
      - if: ${{ always() && (steps.sync.outputs.prerelease == 'false' || steps.sync.outcome != 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-timings.json
          retention-days: 90
