name: Box Sync
run-name: Read-only Box connection ABBA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mizar-box-readonly-connection-probe
  cancel-in-progress: false
jobs:
  connection-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Same-runner same-path read-only connection comparison
        env:
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
        run: node scripts/qualification/box-connection-probe.mjs
