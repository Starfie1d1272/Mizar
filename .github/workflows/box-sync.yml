name: Box Sync
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
      mode:
        type: choice
        options: [sync, probe, verify-downloads]
      transport:
        type: choice
        options: [curl, native]
permissions:
  contents: read
  actions: read
concurrency:
  group: mizar-box-stable
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'Starfie1d1272/Mizar'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download original qualified asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41015011840 --repo Starfie1d1272/Mizar --name release-portable-product --dir "$RUNNER_TEMP/qualified-original"
      - name: Verify original qualification signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$RUNNER_TEMP/qualified-original/Mizar-v1.9.2-Windows-x64-WebInstaller.exe" --repo Starfie1d1272/Mizar --signer-workflow 'Starfie1d1272/Mizar/.github/workflows/release-qualification.yml@refs/heads/main' --source-ref refs/heads/main --source-digest 3fe8ea49fa34cbcb7d11022735f52f77220c6607 --bundle "$RUNNER_TEMP/qualified-original/qualification-provenance.json"
      - name: Isolate exact withdrawn public installer
        env:
          NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
          MIZAR_BOX_REPO_TOKEN: ${{ secrets.MIZAR_BOX_REPO_TOKEN }}
        run: node scripts/qualification/inspect-192-runtime.mjs "$RUNNER_TEMP/qualified-original/Mizar-v1.9.2-Windows-x64-WebInstaller.exe"
